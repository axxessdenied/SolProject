# Sound cues (Phase 8t). `asset` names a cooked .saud by stem; everything
# under assets/sounds/ is generated by tools/scripts/gen_assets.ps1 and can be
# replaced one file at a time by a recorded .ogg.
#
# gain scales the cue, pitch_jitter spreads the playback rate by +-that
# fraction so a repeated cue does not comb-filter against itself, rolloff is
# the distance in meters at which a positional voice has halved, and
# max_instances caps concurrent voices of this cue (0 = unlimited).
#
# Rolloff is a design lever, not physics: it decides how big the world sounds.
# A gunshot fading by 800 m and an explosion carrying to 3 km is what makes a
# dogfight read as close-quarters and a kill read as an event.

# The player's own weapon. Fired as fast as the trigger allows, so it needs
# both jitter and a cap; four overlapping copies of an identical 0.22 s cue
# is a buzz, not a gun.
[[sound]]
id = "sol.weapon_fire"
asset = "weapon_fire"
gain = 0.55
pitch_jitter = 0.08
max_instances = 4

[[sound]]
id = "sol.hit_shield"
asset = "weapon_hit_shield"
gain = 0.7
pitch_jitter = 0.10
rolloff = 800.0
max_instances = 6

[[sound]]
id = "sol.hit_hull"
asset = "weapon_hit_hull"
gain = 0.8
pitch_jitter = 0.10
rolloff = 800.0
max_instances = 6

# Carries furthest of anything: a ship dying two kilometres away is the one
# event worth hearing from across a fight.
[[sound]]
id = "sol.explosion"
asset = "explosion"
gain = 1.0
pitch_jitter = 0.12
rolloff = 3000.0
max_instances = 4

# Retriggered while the mining beam is held, so it is capped hard - the cue is
# 0.45 s and the beam ticks faster than that.
[[sound]]
id = "sol.mining_cut"
asset = "mining_cut"
gain = 0.45
pitch_jitter = 0.06
max_instances = 2

# The single looping voice, played 2D at the listener: it is your own hull.
# rolloff and max_instances do not apply.
[[sound]]
id = "sol.engine_loop"
asset = "engine_loop"
gain = 0.5

[[sound]]
id = "sol.ui_click"
asset = "ui_click"
gain = 0.35
max_instances = 3

[[sound]]
id = "sol.docking"
asset = "docking_chime"
gain = 0.6
max_instances = 1

[[sound]]
id = "sol.alarm"
asset = "alarm"
gain = 0.5
max_instances = 1
