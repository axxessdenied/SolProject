# Station modules (engine plan Phase 34 stage A) — gdd.md §12's vocabulary.
#
# A station is a list of modules, and what it produces, what it can hold, which
# screens it offers when you dock and eventually what it looks like all follow
# from that list. In v1 the galaxy generator composes every NPC station from
# these rows; in v2 the player builds from the same words (decisions/016).
#
# ---------------------------------------------------------------------------
# ⚑⚑⚑⚑ NOTHING READS A MODULE YET, AND THE ORDER ITS READERS ARRIVE IN IS THE
# ONLY THING THAT MAKES THIS FILE HONEST RATHER THAN DECORATIVE. This project
# has twice shipped a word with no reader — Phase 32's ship `role` (deliberate,
# recorded, and the gap named) and Phase 33 stage A's inert commodity, which sat
# at exactly half capacity forever and passed every band the economy's own exit
# test checks. So, written down before anybody can forget it:
#
#   stage B  the composer reads `family`, `power_output`/`power_draw` and the
#            rate lists — it composes archetypes out of these and must satisfy
#            the power rule below
#   stage C  the dock screen reads `screens`
#   stage D  the market reads `stores`, which is what lets a station be unable
#            to hold contraband
#
# ⚑⚑⚑⚑ THE RATE LINES ARRIVED IN STAGE B, AND EVERY ONE OF THEM IS DERIVED FROM
# `stations.toml` RATHER THAN INVENTED. Stage A shipped this file with no rates
# at all and a test that failed if one appeared, because a rate authored before
# the recipe exists is a number nobody searched. The recipes exist now, and the
# constraint they are authored under is exact: **the EXPECTED composition of an
# archetype reproduces that archetype's own rate list**, which
# `station_composition_tests.cpp` checks line by line against the numbers three
# stages of Phase 33 searched for. So `stations.toml` still holds the tuned
# economy; this file holds the same economy taken apart.
#
# ⚑⚑ PRODUCTION IS DETERMINISTIC AND APPETITE IS NOT, WHICH IS THE WHOLE SHAPE
# OF THE DECOMPOSITION. Every industry module sits in its archetype's recipe at
# chance 1.0 carrying exactly that archetype's `produces`/`feedstock`/plate
# upkeep, so no station in the galaxy makes or burns one unit differently than
# it did before stage B. What varies is HABITAT — the food line, per the ruling
# — and everything with no economy attached to it at all: which holds, which
# screens, which people.
#
# ⚑⚑ POWER IS THE EXCEPTION AND IT IS AN EXCEPTION FOR A REASON: RULED
# 2026-08-31, POWER IS THE CONSTRAINT THE COMPOSER SATISFIES. A composition is
# valid only when its draw is covered by its own power family, so these figures
# have exactly one reader and it is the generator. Their SHAPE is a design
# statement — a fusion plant is worth several solar arrays, a shipyard costs
# more than a mission board — and their MAGNITUDE is stage B's to move, on the
# same terms as every placement weight in `stations.toml`. The scale is the
# ship system's, one order up: a hull makes 6–10 and a fitting draws 0.5–3.
#
# ⚑⚑ HABITAT OWNS THE FOOD LINE, RULED THE SAME DAY AND BUILT IN STAGE B. Food
# upkeep is no longer a flat archetype line: it is the sum of what a station's
# habitat modules eat, so two stations of one archetype eat differently and a
# station with no habitat eats nothing. The three rows below are rated 0.05 /
# 0.02 / 0.01 and every archetype's chances are chosen so that the EXPECTED sum
# is exactly the flat number it used to carry — 0.035 for most, 0.05 for the
# mine and the fabricator yard. That arithmetic is a test, not a claim.
#
# ⚑⚑⚑ AND THE FARM IS THE ONE PLACE THE RULING COSTS SOMETHING, SO IT IS PAID
# OUT LOUD: an Agricultural Station burnt NO food before stage B, and a farm
# with nobody on it is a worse world than a slightly different number. The dome
# below therefore produces GROSS — 0.32 — and the farm's own habitat eats 0.06
# of it in expectation, leaving the 0.26 net that `stations.toml` has always
# said. Net food per farm is unchanged to the digit; the galaxy's food MADE and
# BURNT both rise by about 1.0/s, which moves the made-to-burnt ratio from 1.056
# to about 1.045 and is measured rather than asserted.
# ---------------------------------------------------------------------------
#
# Three rows here are vocabulary whose reader is a LATER PHASE rather than a
# later stage, and saying which is cheaper than wondering later: the recreation
# family is Phase 35's bar and the people in it, the shadow family is Phase 37's
# black market (present on stations of any owner, which is how a faction with no
# territory operates), and the capacitor bank is the one module in this file
# with nothing to say to anybody yet — it buffers a budget that no phase models
# over time. It is here because gdd.md §12 lists it and leaving it out would be
# a quieter lie than including it with this sentence attached.

# ---------------------------------------------------------------------------
# Power — the budget every other module draws against.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_solar_array"
name = "Solar Array"
family = "power"
power_output = 8.0

[[module]]
id = "sol.mod_fission_plant"
name = "Fission Plant"
family = "power"
power_output = 30.0
power_draw = 1.0

[[module]]
id = "sol.mod_fusion_plant"
name = "Fusion Plant"
family = "power"
power_output = 80.0
power_draw = 3.0

# Draws nothing, makes nothing, and stores what a station is not yet modelled as
# having: a budget over time. See the header — kept as vocabulary, named as one.
[[module]]
id = "sol.mod_capacitor_bank"
name = "Capacitor Bank"
family = "power"

# ---------------------------------------------------------------------------
# Habitat — population, which is appetite (the food line) and crew.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_habitat_ring"
name = "Habitat Ring"
family = "habitat"
consumes = ["sol.food:0.05"]
power_draw = 6.0

[[module]]
id = "sol.mod_barracks"
name = "Barracks"
family = "habitat"
consumes = ["sol.food:0.02"]
power_draw = 3.0

[[module]]
id = "sol.mod_medical_bay"
name = "Medical Bay"
family = "habitat"
consumes = ["sol.food:0.01"]
power_draw = 2.0

# ---------------------------------------------------------------------------
# Storage — stock capacity, per goods class. A station cannot hold what it has
# no hold for, which is the mechanism behind gdd.md §13's contraband as well as
# the plain fact that an outpost cannot warehouse the galaxy.
#
# ⚑ Capacity is per commodity of that class, which is the unit
# `StationDef::stock_capacity` already uses (2500 today, one number for
# everything). Which class a given commodity IS does not exist yet: it is a key
# on `[[commodity]]` and it belongs to stage D, where it is first read.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_bulk_hold"
name = "Bulk Hold"
family = "storage"
stores = ["bulk:1200"]
power_draw = 1.0

# Refrigeration is why this one costs more to run than a hold four times its
# size: what is in it would otherwise spoil.
[[module]]
id = "sol.mod_cryo_hold"
name = "Cryogenic Hold"
family = "storage"
stores = ["cryo:800"]
power_draw = 3.0

[[module]]
id = "sol.mod_hazmat_hold"
name = "Hazardous Hold"
family = "storage"
stores = ["hazardous:400"]
power_draw = 4.0

# ---------------------------------------------------------------------------
# Industry — the production chains of gdd.md §6, and this is where
# `stations.toml`'s eleven archetypes were taken apart in stage B.
#
# ⚑⚑⚑ EVERY RATE BELOW IS ITS ARCHETYPE'S OWN, COPIED RATHER THAN RE-DERIVED,
# AND EVERY ONE OF THESE ROWS SITS IN EXACTLY ONE RECIPE AT CHANCE 1.0. That is
# what makes the decomposition free: a Refinery still turns 0.31 ore into 0.20
# metal because its refinery line IS those numbers and every Refinery has one.
# The economy did not move, and `station_composition_tests.cpp` is what says so
# rather than this comment.
#
# ⚑⚑ THE PLATE UPKEEP LANDED HERE AND IT FITS BETTER THAN IT DID ON THE
# ARCHETYPE. `stations.toml` carries `sol.hull_plate:0.013` on eight of eleven
# archetypes and pointedly not on the other three - the Fabrication Works
# because "a station consuming its own output is a feedback loop", the Assembly
# Yard because its plate line is feedstock already, and the farm because it is
# not heavy industry. Those are statements about the MACHINE, so the line moved
# onto the machine, and the three that do not burn plate are simply the three
# rows below with no `consumes`.
#
# ⚑ gdd.md §12's family list names six industry modules. It is a sketch rather
# than a row list (the refining service was already two rows for the same
# reason), and a production graph needs one row per conversion: the six below
# are eleven because a farm, two kinds of mine, a breaker line, a reclaimer and
# an assembly line are all industry and none of them is a "fabricator".
# ---------------------------------------------------------------------------

# The Agricultural Station. Produces GROSS - see the header: the farm's own
# habitat eats 0.06 of this in expectation and `stations.toml`'s 0.26 is what is
# left. Its machinery upkeep is the tractor bill and belongs to the dome.
[[module]]
id = "sol.mod_agri_dome"
name = "Agricultural Dome"
family = "industry"
produces = ["sol.food:0.32"]
consumes = ["sol.machinery:0.075"]
power_draw = 6.0

# The Mining Outpost. Its output comes out of the ground rather than off
# anyone's dock, which is `produces_from = "field"` on the ARCHETYPE and stays
# there: the same key is also the placement veto ("a system with no rock
# supports no mine"), and splitting one fact across two files to say it twice
# would be worse than leaving it where the generator already reads it.
[[module]]
id = "sol.mod_ore_extractor"
name = "Ore Extractor"
family = "industry"
produces = ["sol.ore:0.345"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 9.0

# The Ferrous Mine, and the same note about the ground applies.
[[module]]
id = "sol.mod_ferrous_extractor"
name = "Ferrous Extractor"
family = "industry"
produces = ["sol.ore_ferrous:0.20"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 9.0

# The Refinery: smelt at the pit, ship the metal.
[[module]]
id = "sol.mod_refinery"
name = "Refinery Line"
family = "industry"
produces = ["sol.metal:0.20"]
feedstock = ["sol.ore:0.31"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 12.0

# The Foundry. A smelter takes ferrous ore where the refinery takes ore.
[[module]]
id = "sol.mod_smelter"
name = "Smelter"
family = "industry"
produces = ["sol.alloy:0.085"]
feedstock = ["sol.ore_ferrous:0.13"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 12.0

# The Fabricator Yard - refined metal's only consumer and machinery's only
# producer, which is why Phase 33 stage E moved these two numbers twice.
[[module]]
id = "sol.mod_fabricator"
name = "Fabricator"
family = "industry"
produces = ["sol.machinery:0.152"]
feedstock = ["sol.metal:0.19"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 10.0

# The Fabrication Works - the last industrial step before a hardpoint. Burns no
# plate: it makes the stuff.
[[module]]
id = "sol.mod_component_works"
name = "Component Works"
family = "industry"
produces = ["sol.hull_plate:0.12"]
feedstock = ["sol.alloy:0.15"]
power_draw = 8.0

# The Breaker Yard. Produces out of nothing, exactly as the dome does: its input
# is the derelict hulls towed in, and neither sunlight nor a dead ship is a good
# this economy models.
[[module]]
id = "sol.mod_breaker_line"
name = "Breaker Line"
family = "industry"
produces = ["sol.salvage:0.17"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 7.0

# The Reclamation Plant. Makes `sol.alloy` and not a reclaimed variant of it,
# which is Phase 33 stage C's one real design decision and is unchanged here.
[[module]]
id = "sol.mod_reclaimer"
name = "Reclamation Line"
family = "industry"
produces = ["sol.alloy:0.085"]
feedstock = ["sol.salvage:0.13"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 10.0

# The Assembly Yard - the first station in the game with two feedstocks, and the
# first place a shortage on the metal chain is felt on the ferrous one. Its
# plate line is feedstock, so it has no plate upkeep.
[[module]]
id = "sol.mod_assembly_line"
name = "Assembly Line"
family = "industry"
produces = ["sol.hull_section:0.025"]
feedstock = ["sol.machinery:0.030", "sol.hull_plate:0.035"]
power_draw = 16.0

# The Shipyard, which PRODUCES NOTHING and is the honest shape rather than a
# gap: its output is ships, which leave the economy under their own power and
# are not a commodity. T3 is where the tree stops.
[[module]]
id = "sol.mod_shipyard"
name = "Ship Berth"
family = "industry"
feedstock = ["sol.hull_section:0.027"]
consumes = ["sol.hull_plate:0.013"]
power_draw = 20.0

# Repair and refit rather than construction, so it has no rates at all - it is
# in the recipes of the two construction archetypes for the variety and the
# power bill, and Phase 35's people will find it a reason to exist.
[[module]]
id = "sol.mod_drydock"
name = "Drydock"
family = "industry"
power_draw = 14.0

# ---------------------------------------------------------------------------
# Commerce — the Trade, Outfitting and Shipyard screens. This family is where
# gdd.md §12's dividend lives: "a mining outpost with no market floor has no
# Trade tab, and finding one that does is worth flying to."
#
# ⚑ A station's screen list is a UNION over its modules, so two rows naming the
# same screen is an ordinary composition rather than a conflict — a brokerage
# on a station with no floor still trades, it just trades through a broker.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_market_floor"
name = "Market Floor"
family = "commerce"
screens = ["trade"]
power_draw = 3.0

[[module]]
id = "sol.mod_brokerage"
name = "Brokerage"
family = "commerce"
screens = ["trade"]
power_draw = 1.0

[[module]]
id = "sol.mod_outfitter"
name = "Outfitter"
family = "commerce"
screens = ["outfitting"]
power_draw = 2.0

[[module]]
id = "sol.mod_ship_sales"
name = "Ship Sales"
family = "commerce"
screens = ["shipyard"]
power_draw = 2.0

# ---------------------------------------------------------------------------
# Recreation — where the people are, which is where the rumours are (Phase 35).
# No screens yet: the Bar screen does not exist, and naming one here would be
# a def pointing at nothing.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_bar"
name = "Bar"
family = "recreation"
power_draw = 2.0

[[module]]
id = "sol.mod_restaurant"
name = "Restaurant"
family = "recreation"
power_draw = 3.0

[[module]]
id = "sol.mod_concourse"
name = "Concourse"
family = "recreation"
power_draw = 4.0

[[module]]
id = "sol.mod_casino"
name = "Casino"
family = "recreation"
power_draw = 5.0

[[module]]
id = "sol.mod_resort"
name = "Resort"
family = "recreation"
power_draw = 8.0

# ---------------------------------------------------------------------------
# Services — the remaining dock screens.
#
# ⚑⚑ THE REFINING SERVICE IS TWO ROWS BECAUSE THE PAIR IT OFFERS IS PART OF
# WHAT IT IS. `refine_input`/`refine_output` name the commodities a station
# takes off your hands and hands back later (Phase 8f), and today the Refinery
# offers ore → metal while the Reclamation Plant offers salvage → alloy. One
# "refinery service" row could only carry one of them, so gdd.md §12's single
# line becomes two rows here — the family is a sketch, not a row list.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_docking_control"
name = "Docking Control"
family = "services"
power_draw = 4.0

[[module]]
id = "sol.mod_refinery_service"
name = "Refining Service"
family = "services"
screens = ["refinery"]
refine_input = "sol.ore"
refine_output = "sol.metal"
power_draw = 6.0

[[module]]
id = "sol.mod_reclaim_service"
name = "Reclamation Service"
family = "services"
screens = ["refinery"]
refine_input = "sol.salvage"
refine_output = "sol.alloy"
power_draw = 6.0

[[module]]
id = "sol.mod_insurance_office"
name = "Insurance Office"
family = "services"
power_draw = 1.0

[[module]]
id = "sol.mod_crew_hall"
name = "Crew Hall"
family = "services"
screens = ["crew"]
power_draw = 2.0

[[module]]
id = "sol.mod_mission_board"
name = "Mission Board"
family = "services"
screens = ["missions"]
power_draw = 1.0

# ---------------------------------------------------------------------------
# Shadow — black-market services (gdd.md §7, §13), present on stations of ANY
# owner, which is the whole mechanism that lets Phase 37's shadow faction
# operate without holding a single system. No screens: the fence's own screen
# arrives with the faction that runs it.
#
# ⚑ The fence carries a hazardous hold of its own, which is not decoration: a
# station cannot stock what it has no hold for, so a fence that could not hold
# the goods it fences would be a shopfront with no back room.
# ---------------------------------------------------------------------------

[[module]]
id = "sol.mod_fence"
name = "Fence"
family = "shadow"
stores = ["hazardous:250"]
power_draw = 2.0

[[module]]
id = "sol.mod_black_clinic"
name = "Unlicensed Clinic"
family = "shadow"
power_draw = 3.0

[[module]]
id = "sol.mod_ghost_dock"
name = "Ghost Dock"
family = "shadow"
power_draw = 5.0

[[module]]
id = "sol.mod_data_haven"
name = "Data Haven"
family = "shadow"
power_draw = 4.0
