# Outfitting modules (Phase 8a). slot: shield | engine | cargo | utility.
# Modifiers: <stat>_add applies before <stat>_mul; module mass dilutes
# accelerations (mass / (mass + fitted mass)); power_draw sums against the
# ship's power_output. Edits hot-reload into a running dev build.

[[module]]
id = "sol.shield_booster_mk1"
name = "Shield Booster Mk1"
slot = "shield"
price = 800.0
mass = 400.0
power_draw = 2.0
shield_strength_mul = 1.25

[[module]]
id = "sol.shield_booster_mk2"
name = "Shield Booster Mk2"
slot = "shield"
price = 2400.0
mass = 700.0
power_draw = 3.0
shield_strength_mul = 1.5
shield_regen_mul = 1.2
min_rep = 10.0 # Phase 8b: any owner sells it, but only to known customers

