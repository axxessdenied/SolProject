# Outfitting modules (Phase 8a). slot: shield | engine | cargo | utility.
# Modifiers: <stat>_add applies before <stat>_mul; module mass dilutes
# accelerations (mass / (mass + fitted mass)); power_draw sums against the
# ship's power_output. Edits hot-reload into a running dev build.

