# Drawable models (Phase 9). Every mesh the game can draw is named here, and
# the def order is the runtime model index - so adding a mesh is a cooked file
# plus a row, and never a C++ change. Before this file existed the set was a
# five-member enum behind four hardcoded switches, which meant an authored,
# cooked mesh had no way of reaching the game at all.
#
# `mesh` and `texture` are cooked file stems: "ship" is assets/meshes/ship.forge
# cooked to ship.smesh, "hull" is assets/textures/hull.png cooked to hull.stex.
# `radius` is meters at instance scale 1 and the sim multiplies by the scale,
# so a model authored at unit radius takes its size from the scale and one
# authored at its real size is drawn at scale 1.

[[model]]
id = "cube"
mesh = "cube"
texture = "checker"
radius = 1.0

# The habitat torus. Its avoid_radius is deliberately wider than what you can
# hit: 8r's berths ring at 200 m and the whole docking approach was tuned
# against the 130 m figure, so shrinking it to the collision sphere would move
# behaviour this row is only meant to describe.
[[model]]
id = "station"
mesh = "station"
texture = "hull"
radius = 100.0
avoid_radius = 130.0

[[model]]
id = "ship"
mesh = "ship"
texture = "hull"
radius = 8.0

# Authored at radius 1 m; a rock's real size is its instance scale.
[[model]]
id = "asteroid"
mesh = "asteroid"
texture = "hull"
radius = 1.0

# A gate is a doorway you fly THROUGH (Phase 8w), so it blocks nothing - it is
# skipped by both the avoidance set and the collision set. That fact used to be
# written as "the only Cube left among statics", which would have silently
# un-solidified the next Cube-shaped static anyone added.
#
# Since Phase 9 stage D it has its own mesh, authored as a part tree in
# assets/meshes/gate.forge - a real ring you can see through instead of the
# squashed unit cube it shared with everything else. It is authored at REAL
# SIZE and drawn at scale 1 (a ring cannot survive the old non-uniform 70x70x10
# stretch), so the radius here is the mesh's own 106.7 m rather than a unit
# figure the instance scale multiplied up. Nothing in the sim reads it: the
# collision, avoidance, mining and muzzle paths that consult a model radius all
# iterate ships, rocks or wrecks, and `solid = false` keeps a gate out of the
# other two.
[[model]]
id = "gate"
mesh = "gate"
texture = "hull"
radius = 106.7
solid = false

# The membrane in the gate's aperture (Phase 12) - the first translucent model
# in this game, and the reason `translucent` and `alpha` exist as def keys.
#
# It is a second model rather than a part of the gate because a .forge cooks to
# one mesh drawn under one pipeline, and this one needs alpha blending while the
# ring needs the opaque path. It rides at the gate's own transform.
#
# `radius` is the aperture's 70 m, the same number space_world.cpp's crossing
# test uses. Nothing in the sim reads it - `solid = false` keeps the membrane
# out of the collision and avoidance sets exactly as it keeps the gate out, so
# flying through it cannot be affected by it. That is the point: it is something
# you see, not something you hit.
#
# `emissive` is insurance, and it is worth saying what against. The lane axis
# points at the system hub and the star sits on it, so this disc meets the
# sunlight dead-on rather than across it - and the shader does not flip a normal
# for back faces, so lambert is all-or-nothing across BOTH faces at once. As
# authored the profile's normal is -Z, which faces the star, so the film is lit.
# Wind that profile the other way and it goes black from every angle at the same
# time. geometry.unit asserts the sign; this floor is what it would fall back to.
[[model]]
id = "gate_membrane"
mesh = "gate_membrane"
texture = "hull"
radius = 70.0
translucent = true
alpha = 0.30
emissive = 0.35
solid = false

# The player's own frame (Phase 8m), authored in SHIP space around the eye and
# drawn at the ship's transform - so its radius is measured from the ship
# origin, not from the cockpit's own centre, and comes out just inside the
# ship's own 8 m. Nothing reads it today: the cockpit is a RenderInstance and
# never gets a RenderShape, so it is in no collision or avoidance set.
# emissive is here because vacuum ambient is 1.2%, which is right for a hull
# seen from outside and pitch black for a room the player is sitting in.
[[model]]
id = "cockpit"
mesh = "cockpit"
texture = "cockpit"
radius = 8.0
emissive = 0.10
solid = false
