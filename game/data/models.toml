# Drawable models (Phase 9). Every mesh the game can draw is named here, and
# the def order is the runtime model index - so adding a mesh is a cooked file
# plus a row, and never a C++ change. Before this file existed the set was a
# five-member enum behind four hardcoded switches, which meant an authored,
# cooked mesh had no way of reaching the game at all.
#
# `mesh` and `texture` are cooked file stems: "ship" is assets/meshes/ship.forge
# cooked to ship.smesh, "hull" is assets/textures/hull.tex cooked to hull.stex.
# `radius` is meters at instance scale 1 and the sim multiplies by the scale,
# so a model authored at unit radius takes its size from the scale and one
# authored at its real size is drawn at scale 1.

[[model]]
id = "cube"
mesh = "cube"
texture = "checker"
radius = 1.0

# The habitat torus. Its avoid_radius is deliberately wider than what you can
# hit: 8r's berths ring at 200 m and the whole docking approach was tuned
# against the 130 m figure, so shrinking it to the collision sphere would move
# behaviour this row is only meant to describe.
[[model]]
id = "station"
mesh = "station"
texture = "hull"
radius = 100.0
avoid_radius = 130.0

[[model]]
id = "ship"
mesh = "ship"
texture = "hull"
radius = 8.0

# Authored at radius 1 m; a rock's real size is its instance scale.
[[model]]
id = "asteroid"
mesh = "asteroid"
texture = "hull"
radius = 1.0

# A gate is a doorway you fly THROUGH (Phase 8w), so it blocks nothing - it is
# skipped by both the avoidance set and the collision set. That fact used to be
# written as "the only Cube left among statics", which would have silently
# un-solidified the next Cube-shaped static anyone added.
#
# Since Phase 9 stage D it has its own mesh, authored as a part tree in
# assets/meshes/gate.forge - a real ring you can see through instead of the
# squashed unit cube it shared with everything else. It is authored at REAL
# SIZE and drawn at scale 1 (a ring cannot survive the old non-uniform 70x70x10
# stretch), so the radius here is the mesh's own 106.7 m rather than a unit
# figure the instance scale multiplied up. Nothing in the sim reads it: the
# collision, avoidance, mining and muzzle paths that consult a model radius all
# iterate ships, rocks or wrecks, and `solid = false` keeps a gate out of the
# other two.
[[model]]
id = "gate"
mesh = "gate"
texture = "hull"
radius = 106.7
solid = false

# The membrane in the gate's aperture (Phase 12) - the first translucent model
# in this game, and the reason `translucent` and `alpha` exist as def keys.
#
# It is a second model rather than a part of the gate because a .forge cooks to
# one mesh drawn under one pipeline, and this one needs alpha blending while the
# ring needs the opaque path. It rides at the gate's own transform.
#
# `radius` is the aperture's 70 m, the same number space_world.cpp's crossing
# test uses. Nothing in the sim reads it - `solid = false` keeps the membrane
# out of the collision and avoidance sets exactly as it keeps the gate out, so
# flying through it cannot be affected by it. That is the point: it is something
# you see, not something you hit.
#
# ⚑⚑ THE ONE ROW IN THIS FILE THAT NAMES A MATERIAL (Phase 25 stage B), and
# therefore the one that carries none of `texture`/`emissive`/`translucent`/
# `alpha` - a row may name a material or describe one, never both, and the
# schema refuses a row that tries. Everything that used to be on those four
# keys is in materials.toml under `sol.gate_membrane`, unchanged in value.
#
# It moved because it wanted something those keys cannot say: its own fragment
# shader. `mesh.frag` does not flip the normal for back faces, so lambert on a
# one-sided film is all-or-nothing across BOTH faces at once - this disc was
# lit only because its authored profile normal is -Z, which happens to face the
# star, and the paragraph that used to sit here hedged against that with an
# emissive floor. `membrane.frag` flips it, so winding the profile the other
# way no longer turns the film black from every angle at once. geometry.unit
# still asserts the sign; it is no longer the only thing standing between the
# aperture and a black disc.
[[model]]
id = "gate_membrane"
mesh = "gate_membrane"
material = "sol.gate_membrane"
radius = 70.0
solid = false

# The player's own frame (Phase 8m), authored in SHIP space around the eye and
# drawn at the ship's transform - so its radius is measured from the ship
# origin, not from the cockpit's own centre, and comes out just inside the
# ship's own 8 m. Nothing reads it today: the cockpit is a RenderInstance and
# never gets a RenderShape, so it is in no collision or avoidance set.
#
# ⚑ Phase 25 stage C: the surface moved to `sol.cockpit` in materials.toml,
# which keeps the same texture and the same `emissive` floor and adds a glow
# mask so the instruments light rather than the whole cabin. A row naming a
# material carries none of the four surface keys - that row's business now.
[[model]]
id = "cockpit"
mesh = "cockpit"
material = "sol.cockpit"
radius = 8.0
solid = false

# ---------------------------------------------------------------------------
# Roles (Phase 19): which model fills each slot the engine draws into.
#
# A [[model]] row says a mesh EXISTS. A [[role]] row says what the game reaches
# for when it needs a gate, a rock, a bolt. Before this section those answers
# were string literals in space_world.cpp and main.cpp, which is why Phase 9
# stage A's exit criterion turned out to be narrowly true: a *ship* def could
# fly an authored mesh, and nothing else in the world could use one at all.
#
# The slot names are fixed by the engine (game/src/model_roles.hpp) - data
# cannot invent a new kind of thing - but every answer below is editable, and
# a mod overrides one exactly the way it overrides a ship, by id.
#
# ⚑ Loading REFUSES, rather than warning, if a role here is unknown, names a
# model that does not exist, or is missing entirely. A ship def with a bad
# model name falls back to the shuttle hull and logs; a role has nothing to
# fall back to, and a silently invisible gate in all eighty systems is worse
# than a refusal that names this file.

[[role]]
id = "gate"
model = "gate"

# Drawn at the identical transform as the gate, under the blended pipeline
# (Phase 12). Splitting it from the ring is what lets it be a separate model.
[[role]]
id = "gate_membrane"
model = "gate_membrane"

# ⚑ THE THREE BELOW MUST NAME A MODEL AUTHORED AT radius = 1.0, and this is a
# contract about PHYSICS, not about looks. Each is drawn at an instance scale
# that means something in metres - a rock's scale IS its radius, a chunk is
# 6 m, a bolt is 0.3 x 0.3 x 4 m - and `modelBaseRadius() * scale` is what the
# collision set, the avoidance set and the mining/salvage beam sweep all read.
# Point one of these at a model of some other radius and every instance of it
# silently changes size and hit sphere, with nothing visibly wrong to explain
# it. `assets.unit` asserts this rather than trusting anyone to read the
# comment.
[[role]]
id = "rock"
model = "asteroid"

[[role]]
id = "ore_chunk"
model = "cube"

[[role]]
id = "bolt"
model = "cube"

# The one drawable with no entity behind it: the game layer pushes it at the
# ship's transform rather than reading it off a RenderShape.
[[role]]
id = "cockpit"
model = "cockpit"

# Fallbacks. A ship or station def naming a model that does not exist still
# has to draw something, and these say what. Unlike a role above, reaching one
# of these means a def somewhere is wrong and the log says so - they are the
# shape you see when a name is broken, not a shape anything asks for.
#
# ⚑ These three are why the recorded count of hardcoded model names was six
# and the real one was ten: a fallback is a model name too, and stage H moved
# two of them from inside `modelIdFromName` out to its call sites, which reads
# like a cleanup and removed nothing.
[[role]]
id = "station"
model = "station"

[[role]]
id = "ship"
model = "ship"

# A dead hull, when the ship that died cannot be identified. Oversized and
# adrift; a proper broken hull is polish, not mechanism.
[[role]]
id = "wreck"
model = "ship"

# The freighter's flight deck (Phase 19). The row itself was written by the
# Forge's `create [[model]] row` button, which measured `radius` off the mesh -
# 7.4173 m, and it said so.
#
# ⚑ THE VALUES BELOW ARE THE ONES THE TOOL CANNOT INFER, and they are what
# makes this an INTERIOR rather than a prop. `solid` is off because this is a
# room, not an obstacle; geometry cannot tell you that.
#
# ⚑ Phase 25 stage C: the surface keys this row used to carry - `texture`, which
# defaulted to `checker` because a combo has to default to something, and the
# `emissive` floor that stopped a room being pitch black at 1.2% ambient - are
# both in `sol.cockpit` now, which it shares with the player's own frame. That
# is the first material two models wear, so the boot line's model count and
# material count finally disagree, on purpose.
[[model]]
id = "freighter_cockpit"
mesh = "freighter_cockpit"
material = "sol.cockpit"
radius = 7.4173
solid = false

# ---------------------------------------------------------------------------
# Fittings (Phase 31 stage E): what a gun standing in a mount is drawn as.
#
# ⚑ THESE ARE THE FIRST MODELS IN THIS FILE THAT ARE NOT A WORLD OBJECT. A gate,
# a rock and a hull each have an entity behind them; a fitting has none - it is
# drawn hanging off its owner's transform, the way the cockpit is, because a
# gun that could outlive its ship is exactly the entity trap `kMaxShipWeapons`
# exists to make inexpressible.
#
# ⚑ AUTHORED AT REAL SIZE AND DRAWN AT THE HULL'S SCALE, so `radius` here is the
# mesh's own measured bounding radius rather than a unit figure. Nothing in the
# sim reads it: a fitting is in no collision, avoidance or mining set, and the
# gun's reach comes from its weapon def. It feeds LOD selection, and both meshes
# are under the cooker's 256-triangle floor so neither has a chain to select
# from - which is why the numbers can be exact rather than tuned.
#
# ⚑ `solid` is left at its default TRUE and it costs nothing, because the sets
# that read it iterate entities and a fitting is not one. Writing `solid = false`
# here would look like a decision about whether you can hit a turret, and mount
# condition (stage F) is where that question actually gets answered.

[[model]]
id = "cannon"
mesh = "cannon"
texture = "hull"
radius = 1.6707

[[model]]
id = "emitter"
mesh = "emitter"
texture = "hull"
radius = 1.1268

# ⚑ A FALLBACK, NOT AN ANSWER. A weapon or component def that names NO model
# draws nothing at all - a bare hardpoint, which is the honest picture of kit
# nobody has authored a mesh for. This row is only reached when a def names a
# model that does not exist, which is a mistake and should be visible. See
# game/src/model_roles.hpp, where that split is written down.
[[role]]
id = "fitting"
model = "cannon"
