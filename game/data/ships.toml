# Base-game ship defs (mod zero). Flat snake_case keys; unspecified flight
# keys fall back to engine defaults (see sol/assets/data_defs.hpp).
# Edits hot-reload into a running dev build.
#
# ⚑ A SHIP IS ITS MOUNTS, AND SINCE PHASE 31 STAGE B THAT IS THE WHOLE OF THE
# FIT MODEL. The four `slots_*` counts and the single `weapon =` key are gone;
# a `[[ship.mount]]` is a named, typed, sized place where exactly one fitting
# goes (gdd.md §11.5, `decisions/014`). A mount declares:
#
#   id    unique on this hull and STABLE - a save names a fitting by its mount
#   kind  turret fixed launcher bay | engine thruster shield armor utility
#         subsystem hangar dock
#   size  small | medium | large | xlarge; a mount takes its size or smaller
#   at    metres in the hull frame (+X right, +Y up, -Z fwd) at scale 1, so a
#         `scale = 4.0` hull's mounts are multiplied like the rest of it.
#         PRESENT means external - drawn, and shot at where it sits. ABSENT
#         means internal: it exists, it can be destroyed, it is never drawn.
#         ⚑ SINCE PHASE 31 STAGE C1 THIS IS ALSO THE MUZZLE: a fitted gun
#         fires from its mount's `at`, so a weapon mount that is not on the
#         hull's SURFACE puts its bolts inside the ship. See the note below.
#   aim   facing, hull frame. Needs an `at`. Defaults to the SHIP'S NOSE, so a
#         gun mount that authors nothing here is a gun that shoots forward.
#         ⚑ SINCE PHASE 31 STAGE C2 A GUN REALLY FIRES DOWN THIS.
#   arc   degrees of traverse. Needs an `at`. THE TRAVERSE BELONGS TO THE
#         MOUNT, which is why a `fixed` gun fitted into a `turret` traverses
#         and no weapon def has to be authored twice.
#         ⚑ IT IS THE FULL CONE ANGLE CENTRED ON `aim`, NOT A HALF-ANGLE: a
#         270 ring reaches 135 degrees either side, which is what lets a
#         dorsal turret fire ahead, astern and to both beams and go blind only
#         through the hull it is bolted to. 0 is a gun bolted down; 360 has no
#         stop at all.
#   fit   what the hull SHIPS WITH - a component or weapon def id, empty for a
#         mount that comes bare. This is where `weapon =` went. It is a
#         default, not a constraint: an NPC flies it, a bought hull arrives
#         with it, and the player refits from there.
#
# ⚑⚑ WHAT A GUN ACTUALLY DOES WITH `aim` AND `arc`, SINCE STAGE C2, because it
# is a balance fact and not just a schema one. A gun with `arc = 0` points
# where it is aimed and the pilot aims it by flying. A gun with an arc is laid
# by a gunner: it swings onto the SHIP the pilot has selected - leading it,
# with its own projectile speed - and follows the nose when there is no target,
# when the target is beyond that gun's own `range`, or WHEN THE TARGET IS NOT
# HOSTILE. A gun that cannot reach round far enough HOLDS ITS FIRE rather than
# shooting into its own stop, so it spends no charge and starts no cooldown.
#
# ⚑ THE HOSTILITY GATE IS WHY A RING IS SAFE TO LEAVE ARMED. A gunner does not
# open on a neutral, so hailing a patrol and then firing at a rock does not put
# a bolt into the police. You OPEN with the nose and the rings join once it is
# a fight - the threat tier is read live, so a neutral that shoots back is a
# hostile within the tick.
#
# ⚑⚑ AND A KEY THAT IS DELIBERATELY NOT IN THIS FILE: A FIRE GROUP. Since
# stage C3 every gun answers to one of four triggers and the pilot cycles
# between them with one key, but WHICH group a gun is in is the PLAYER'S
# setting - made on the ship readout and saved with their fit - and a mount
# cannot declare one. A hull that shipped a gun in group 2 would be a hull
# whose gun an NPC never fires, because an NPC has no console to change the
# selection with. Every gun on every hull here is therefore in group 1, which
# is also why nothing in this file had to change for C3.
#
# ⚑ WHAT THE STAGE-B CONVERSION KEPT AND WHAT IT COST. The mount lists were
# authored in stage A2 to reproduce each hull's capacity exactly, and stage B
# only deleted the counts they were copied from - so nothing here is a
# re-balance. The one real change is the one stage A2 warned about: gdd.md
# §11.5 HAS NO `cargo` KIND, so `slots_cargo` and `slots_utility` are one
# `utility` pool now. On the freighter a hold pod and a survey scanner compete
# for the same five places where they used to have three and two.
#
# ⚑⚑⚑ EVERY HULL IN THIS FILE DECLARES A `class` AND A `role` SINCE PHASE 32
# STAGE A, AND EVERY ONE OF THEM IS OUT OF ITS OWN CLASS BAND ON PURPOSE. The
# class is gdd.md §11.3's cell for that ship type - Shuttle and Interceptor in
# `light`, Freighter in `heavy` - and the LENGTH is whatever the shared
# placeholder mesh happens to measure at this hull's `scale`:
#
#   sol.shuttle       12.0 m   declares light (20-45 m)     measures skiff
#   sol.interceptor    9.6 m   declares light (20-45 m)     measures skiff
#   sol.freighter     48.0 m   declares heavy (120-300 m)   measures medium
#
# ⚑ `class` IS A WORD AND NOT A NUMBER, decided at stage A's checkpoint: 11.1
# numbers its rows, but a number in a file has no wrong spelling - `class = 9`
# is a typo the schema catches and `class = 2` where the author meant 3 is not,
# where `heavy` and `medium` cannot be confused by a slipped digit. It also
# reads like every other enumerated key here: `kind`, `size`, `region`.
#
# The Forge's hull spine measures all three and says so. IT IS NOT A BUG LIST
# TO SILENCE, IT IS THE ARTIST'S WORK QUEUE: one 12 m mesh does duty for three
# ships here, `scale` exists only to stretch it, and a real hull will be
# authored at true length and want `scale = 1.0` - so any scale number tuned
# now is thrown away the day the meshes land. The class is what survives, which
# is why the class is what is authored and the geometry is what is wrong.
#
# ⚑ AND TWO THINGS THAT COME OUT WRONG, SAID HERE RATHER THAN LEFT TO BE FOUND.
# The shuttle and interceptor carry FIVE mounts against gdd.md §11.1's class-1
# budget of 2-4; the band is a SOFT contract, and stage A's warning measures
# LENGTH rather than mount count, so this one is still only written down here.
# And the freighter's `core_sensor` accepts NOTHING the base game ships: it is
# the only `subsystem` mount in the file and `components.toml` has no
# `subsystem` component, on purpose - the survey scanners stayed `utility` so
# that the player's starting shuttle did not lose them. A mount waiting for
# content is the honest state of it.
#
# ⚑⚑ EVERY EXTERNAL MOUNT IS ON THE SKIN NOW, AND STAGE E2 IS WHAT FINISHED
# THE JOB C1 STARTED. Until C1 nothing read `at`, so the stage-A2 positions were
# placed INSIDE the shared `ship` mesh - which spans z -7..+5, x +/-3.5,
# y -1.7..+2.0. C1 moved the WEAPON mounts, because a mount is a muzzle and
# `ship_camera.hpp` seats the eye at z = -5.0 without scaling it, so the
# shuttle's old `gun_nose` at z = -2.4 would have fired every bolt two and a
# half metres BEHIND the player's head. It left the utility and engine mounts
# inside on purpose - nothing read them, and moving them would have been
# guessing at what the drawing stage needed. E2 draws them, so E2 places them.
#
# ⚑⚑ AND `aim` MEANS SOMETHING ON A MOUNT THAT DOES NOT SHOOT: IT IS THE WAY
# OUT OF THE PLATING. Every fitting mesh is authored with its mounting face at
# the origin and its body along +Y, and `mountRotation` puts that +Y on `aim` -
# so `[0, -1, 0]` hangs a hold pod under the belly, `[0, 1, 0]` stands a dish on
# the deck, and `[0, 0, 1]` opens a drive bell dead astern. One key, one rule,
# no per-kind branch anywhere in the code. A mount that authors none keeps the
# nose default, which points the fitting FORWARD - fine for a gun and wrong for
# anything bolted to a surface, so an external non-weapon mount should always
# say.
#
# The positions below are measured against the shared `ship` mesh: the belly
# runs y -1.3 at z = -1 to -1.7 at z = +5, the deck y +1.5 to +2.0 over the
# same run, and the rear face is the z = +5 plane. They are the first thing a
# real hull mesh will move (Phase 32).

[[ship]]
id = "sol.shuttle"           # the player's ship (game/src/space_world.hpp)
name = "Shuttle"
class = "light"
role = "logistics"
model = "ship"
scale = 1.0
forward_accel = 60.0
reverse_accel = 40.0
lateral_accel = 30.0
vertical_accel = 30.0
max_speed = 220.0
max_turn_rate = [1.6, 1.2, 2.6]
angular_accel = [6.0, 4.5, 9.0]
boost_accel_scale = 3.0
boost_speed_scale = 1.75
cruise_speed_scale = 25000.0
cruise_accel_scale = 12000.0
shield_strength = 100.0
shield_regen = 8.0
shield_regen_delay = 4.0
armor = 50.0
hull = 100.0
weapon_capacitor = 100.0
weapon_recharge = 15.0
scan_range = 2.5e8   # pulse reach, meters (Phase 8e)
scan_speed = 1.0     # target-scan rate multiplier
price = 8000.0
mass = 10000.0
power_output = 6.0
crew_berths = 1

  # A class-1 hull with one gun and nothing spare: five smalls is the whole
  # budget, and the trade the player already makes - a cargo pod OR a scanner -
  # is the same trade with the mount named.
  # On the chin at the very tip of the wedge (the mesh's nose point is
  # 0, 0.3, -7.0), which is 1.6 m ahead of the seat rather than 2.6 m behind
  # it. Stage C1 made this position the muzzle.
  [[ship.mount]]
  id = "gun_nose"
  kind = "fixed"
  size = "small"
  at = [0.0, -0.1, -6.6]
  fit = "sol.pulse_cannon"

  # On the rear face (the z = +5 plane), aiming astern so the bell opens the
  # way the thrust goes.
  [[ship.mount]]
  id = "drive_main"
  kind = "engine"
  size = "small"
  at = [0.0, 0.15, 5.0]
  aim = [0.0, 0.0, 1.0]

  [[ship.mount]]
  id = "shield_core"
  kind = "shield"
  size = "small"

  # Underslung, either side of the keel. The belly at z = 0.6 is y = -1.41, and
  # a pod is 0.9 m across, so +/-1.3 clears the centreline and the chine both.
  [[ship.mount]]
  id = "bay_port"
  kind = "utility"
  size = "small"
  at = [-1.3, -1.41, 0.6]
  aim = [0.0, -1.0, 0.0]

  [[ship.mount]]
  id = "bay_starboard"
  kind = "utility"
  size = "small"
  at = [1.3, -1.41, 0.6]
  aim = [0.0, -1.0, 0.0]

[[ship]]
id = "sol.interceptor"
name = "Interceptor"
class = "light"
role = "line"
model = "ship"
scale = 0.8
forward_accel = 110.0
reverse_accel = 60.0
lateral_accel = 55.0
vertical_accel = 55.0
max_speed = 340.0
max_turn_rate = [2.4, 1.9, 3.6]
angular_accel = [11.0, 8.0, 15.0]
boost_accel_scale = 3.5
boost_speed_scale = 2.0
shield_strength = 70.0
shield_regen = 12.0
shield_regen_delay = 3.0
armor = 25.0
hull = 60.0
weapon_capacitor = 90.0
weapon_recharge = 18.0
scan_range = 2.0e8
scan_speed = 1.2
price = 24000.0
mass = 8000.0
power_output = 8.0
crew_berths = 1

  # Two drives and no hold: the interceptor spends its budget on getting there.
  # One utility mount here against the shuttle's two is what the old
  # `slots_cargo = 0` said, and it is the clearest thing in this file that a
  # mount list says what a slot count could not.
  [[ship.mount]]
  id = "gun_nose"
  kind = "fixed"
  size = "small"
  at = [0.0, -0.1, -6.6]
  fit = "sol.pulse_cannon"

  # Both on the rear face, wide enough apart that the two bells do not touch -
  # a nozzle is 1.04 m across the mouth and these are 3 m apart.
  [[ship.mount]]
  id = "drive_port"
  kind = "engine"
  size = "small"
  at = [-1.5, 0.15, 5.0]
  aim = [0.0, 0.0, 1.0]

  [[ship.mount]]
  id = "drive_starboard"
  kind = "engine"
  size = "small"
  at = [1.5, 0.15, 5.0]
  aim = [0.0, 0.0, 1.0]

  [[ship.mount]]
  id = "shield_core"
  kind = "shield"
  size = "small"

  # On the dorsal deck, FORWARD of the fin - which stands on the centreline
  # from z = 1.0 back, so anything racked behind this would be inside it.
  [[ship.mount]]
  id = "rack_spine"
  kind = "utility"
  size = "small"
  at = [0.0, 1.62, 0.4]
  aim = [0.0, 1.0, 0.0]

[[ship]]
id = "sol.freighter"
name = "Freighter"
class = "heavy"
role = "logistics"
model = "ship"
# ⚑ The first ship in this game to fly its own interior (Phase 19). The eye
# does not move with `scale` - kCockpitOffset is a constant - so this is not a
# bigger cabin than the shuttle's, it is a different one at the same size.
cockpit = "freighter_cockpit"
scale = 4.0
forward_accel = 18.0
reverse_accel = 10.0
lateral_accel = 8.0
vertical_accel = 8.0
max_speed = 120.0
max_turn_rate = [0.5, 0.4, 0.8]
angular_accel = [1.5, 1.2, 2.2]
boost_accel_scale = 2.0
boost_speed_scale = 1.4
shield_strength = 160.0
shield_regen = 5.0
shield_regen_delay = 6.0
armor = 140.0
hull = 320.0
weapon_capacitor = 60.0
weapon_recharge = 8.0
cargo = 200.0
scan_range = 2.2e8
scan_speed = 0.8
price = 60000.0
mass = 40000.0
power_output = 10.0
crew_berths = 2

  # ⚑ The one hull whose mount list is worth reading twice. It carries a
  # `turret` rather than a `fixed` gun because a freighter that has to point its
  # nose at a raider to shoot back is a freighter that cannot run away while
  # doing it - which is the whole of what a turret buys, and since stage C2 it
  # is what this hull actually does. Its size is `medium` because this hull
  # DECLARES `class = "heavy"` above, and a medium mount takes a small gun
  # (`mountAccepts`) so the `sol.mining_laser` below still fits without the
  # mount lying about the hull. The laser is authored `fixed`; the ring is what
  # makes it traverse.
  # ⚑ THE OLD WORDING HERE SAID "at `scale = 4.0` this is a class-3 hull by
  # gdd.md §11.1's length band", AND IT WAS FALSE: 4x a 12 m mesh is 48 m, and
  # class 3 starts at 120. Phase 32 stage A measured it rather than asserting
  # it. See the header note - the class is the intent and the geometry is the
  # placeholder.
  [[ship.mount]]
  id = "turret_dorsal"
  kind = "turret"
  size = "medium"
  at = [0.0, 1.6, -0.4]
  aim = [0.0, 1.0, 0.0]
  arc = 270.0
  fit = "sol.mining_laser"

  # ⚑ THE SECOND WEAPON MOUNT IN THE GAME, AND IT COMES BARE (Phase 31 stage
  # C1). Until this hull had two, nothing in the base game could fit two guns
  # to one ship - so the phase's own exit criterion ("fire them
  # independently") was unreachable in shipped content and only a fixture
  # could see plural guns at all.
  #
  # It is on the FREIGHTER rather than the interceptor for two reasons and
  # both are written down elsewhere in this file. A ninth mount sits inside
  # gdd.md 11.1's class-3 budget of 8-14, where a sixth on a class-1 hull
  # would deepen the 2-4 overrun the header already apologises for; and this
  # is the hull that carries a ring rather than a bolted gun, so a dorsal and
  # a ventral turret is what a turreted hull IS.
  #
  # ⚑ NO `fit`, ON PURPOSE. An NPC freighter still flies the one mining laser
  # it flew before, so stage C1 changes the balance of nothing that already
  # existed; the mount is somewhere for a PLAYER to put a second gun.
  #
  # ⚑⚑ AND SINCE STAGE C2 THE PAIR MEANS SOMETHING GEOMETRIC: dorsal and
  # ventral, each with 135 degrees either side of its own aim, leave this hull
  # NO BLIND BEARING - a player who arms both can answer fire from any
  # direction without turning the ship. That is the claim
  # `the_shipped_freighter_can_be_armed_to_cover_every_bearing` measures over
  # the whole sphere, and it is why the second ring points the opposite way
  # rather than sitting beside the first.
  [[ship.mount]]
  id = "turret_ventral"
  kind = "turret"
  size = "medium"
  at = [0.0, -1.4, -0.4]
  aim = [0.0, -1.0, 0.0]
  arc = 270.0

  [[ship.mount]]
  id = "drive_main"
  kind = "engine"
  size = "medium"
  at = [0.0, 0.15, 5.0]
  aim = [0.0, 0.0, 1.0]

  [[ship.mount]]
  id = "shield_core"
  kind = "shield"
  size = "medium"

  # Five places where three `slots_cargo` and two `slots_utility` used to be -
  # four utility mounts and the internal one below. A hold pod and a survey
  # scanner compete for the same place on this hull now, which is the merge the
  # header note names.
  # ⚑ THE THREE HOLDS ARE 2.4 m APART BECAUSE A POD IS 2.4 m LONG. They ran
  # 1.2 m apart while they were interior points and nothing was drawn at them;
  # at that spacing the containers would now overlap each other by half their
  # length. Spread to z = -1.0, 1.4 and 3.8 they sit end to end along the keel
  # and the aftmost one finishes exactly at the tail.
  [[ship.mount]]
  id = "hold_forward"
  kind = "utility"
  size = "medium"
  at = [0.0, -1.3, -1.0]
  aim = [0.0, -1.0, 0.0]

  [[ship.mount]]
  id = "hold_mid"
  kind = "utility"
  size = "medium"
  at = [0.0, -1.46, 1.4]
  aim = [0.0, -1.0, 0.0]

  [[ship.mount]]
  id = "hold_aft"
  kind = "utility"
  size = "medium"
  at = [0.0, -1.62, 3.8]
  aim = [0.0, -1.0, 0.0]

  # Off the centreline on the dorsal deck, so it clears both the fin and
  # `turret_dorsal`'s ring.
  [[ship.mount]]
  id = "rack_port"
  kind = "utility"
  size = "small"
  at = [-1.1, 1.62, 0.4]
  aim = [0.0, 1.0, 0.0]

  # Internal, and the only mount in this file that is: no `at`, so it is never
  # drawn and never aimed at. gdd.md §11.5's subsystems are where a hull's
  # character beyond its guns lives, and a freighter is the hull that most
  # wants a better sensor package - but nothing in `components.toml` is a
  # `subsystem` yet, so this mount is empty and stays empty until Phase 32
  # authors the kit that earns it.
  [[ship.mount]]
  id = "core_sensor"
  kind = "subsystem"
  size = "medium"
