# Faction defs (Phase 8b). kind: major | pirate | shadow. Majors claim
# territory from core capitals in def order; pirate defs are clan templates —
# the galaxy generator stamps one clan per lawless fringe neighborhood from
# them, jittering color and personality per clan seed.
#
# ⚑⚑⚑⚑ A `shadow` FACTION CLAIMS NOTHING, AND EVERY GENERATION SITE HAD TO
# LEARN THAT ON PURPOSE (Phase 37 stage B). The counting site in
# `generateUniverse` was a TERNARY — "pirate template, else claimant" — so a
# `kind = "shadow"` row added with no other change would have been counted as a
# major, handed a capital by `claimTerritory`, and every system in the galaxy
# would have been redistributed around a faction whose entire definition is
# that it owns nothing. Two more sites had the same shape written as
# `if (pirate) continue`. All three ask `== Major` now. The guard is the golden
# galaxy digest, and it says the strongest thing this stage has to say: adding
# the row below moved NOTHING.
#
# ⚑⚑ A shadow faction is appended LAST to the runtime faction table, after the
# clans, because a clan's index is `factionCount + clanIndex` computed by hand
# in three places. Its own index therefore exists only after a galaxy has been
# generated — which is why, like a clan, it has no `station_bias` row.
#
# aggression drives raid appetite, forgiveness the drift back to baseline.
# relations are "faction_id:standing" (-100..100); declare each pair from
# ONE side (both sides must agree if repeated). Unspecified major<->pirate
# pairs default to -60 (open war); everything else defaults to 0.
#
# station_bias is what a faction BUILDS where it holds territory (Phase 13):
# "station_id:multiplier" against the archetype's region weight in
# stations.toml. It MULTIPLIES rather than replaces, so the region gradient
# still decides the baseline - ore in the fringe, factories in the core - and
# a faction only tilts it. Omit an archetype to leave it at 1.0; 0 means this
# faction never builds one at all.
#
# ⚑ The descriptions below have asserted these characters since 8b and the
# galaxy generator read none of it until now. The numbers are meant to follow
# the prose, not the other way round: if you change what a faction IS, change
# its bias to match. Pirate clans have no bias - they are raiders, and their
# faction indices do not exist until the galaxy is generated.
#
# ⚑⚑⚑ THIS KEY MOVES THE ECONOMY AND NOTHING SAID SO FOR TWENTY PHASES (found
# by Phase 33 stage E). A multiplier here changes how many of an archetype the
# galaxy contains, which changes how much of a commodity is made against how
# much is burnt - so an edit in THIS file re-tunes `stations.toml`, and until
# stage E `economy_tests.cpp` mirrored `stations.toml` and `commodities.toml`
# and had never heard of this one. The Hegemony's x2.6 factory and x2.2 refinery
# are why the shipped galaxy runs 17 Fabricator Yards against 13 Refineries.
# **Change a bias and re-run `economy_no_commodity_is_made_much_faster_than_it_
# is_burnt`, which now counts the galaxy these rows build.**
#
# ⚑⚑ AND THE ROWS BELOW NAME FOUR ARCHETYPES WHERE `stations.toml` HAS NINE.
# The five added by Phase 33 - Ferrous Mine, Foundry, Fabrication Works, Breaker
# Yard, Reclamation Plant - take 1.0 from every faction, so the whole ferrous
# chain and the whole salvage leg are faction-neutral scenery while the metal
# chain carries every faction's character. Recorded rather than fixed: giving
# five archetypes a character across five factions is a design pass with its own
# re-tune behind it, not a line in somebody else's stage.
#
# ⚑⚑ builds_no is the roster's version of that "0" (Phase 32 stage C): a list of
# the cells - patrol, raider, trader - this faction fields NOTHING for. It is a
# key rather than an empty list because an empty list already meant four other
# things: until this stage a bare `ships_trader` made a faction haul in its
# PATROL hulls, and a bare `ships_raider` made a contested attacker fly its
# patrol hulls, both by a rule written out by hand at the call site. A cell
# named here must not also be listed, and saying both is refused at load.
#
# ⚑ A cell that is neither listed nor declared is UNSPECIFIED, which is legal
# and warns at load. That warning is the point: "this faction fields none" and
# "nobody has decided yet" were the same silence before this pass.

#
# ⚑⚑⚑⚑ contraband AND restricted ARE THIS FACTION'S LAW (Phase 33 stage D,
# gdd.md §13). Commodity ids: `contraband` is forbidden outright, `restricted`
# is licensed - you may carry it, and a patrol will want to see the paperwork.
# Saying both about one good is refused at load.
#
# ⚑⚑⚑ THE LISTS ARE HERE AND NOT ON A COMMODITY, WHICH IS THE ENTIRE POINT.
# gdd.md §13: "Cargo is never intrinsically illegal; jurisdictions are." A
# `contraband = true` on a good would have been the schema deciding that a crate
# means the same thing everywhere, which is exactly what this game is about not
# being true - and it is why `CommodityTier` deliberately ships no such value.
#
# ⚑⚑⚑ TWO MAJORS DECLARE NOTHING AND THAT IS AN ANSWER, NOT A GAP. The Freight
# Guild owns most stations and hates disruption; the Frontier Compact holds the
# frontier together with sealant and spite. Neither has any interest in telling
# a hauler what may be in the hold, and a faction with jurisdiction and no
# opinion is a state the query answers as `legal` - which is a different fact
# from the `unpoliced` that comes back where nobody holds the space at all.
#
# ⚑⚑ AND THERE IS EXACTLY ONE DOCK IN THE GALAXY WHERE `unpoliced` COMES BACK:
# `sol.lantern`, the authored `lawless = true` system in systems.toml. Every
# other unclaimed neighbourhood is swept up by `spawnClans`, and a pirate clan
# IS a jurisdiction - it holds the space and it stops ships, it simply has no
# table. That is why clan space is where a smuggler breathes out, and it falls
# out of the mechanism rather than being written anywhere as a case.
#
# ⚑ Pirate templates carry no lists, so every clan stamped from one answers
# `legal` for everything. If a clan should ever outlaw something, put it on the
# template: a clan consults its template's table (`GameFaction::defId`).

[[faction]]
id = "sol.navy"
name = "Solar Navy"
description = "System security; patrols the gate lanes of the civilized core."
color = [0.25, 0.45, 1.0]
kind = "major"
aggression = 0.35
forgiveness = 0.7
relations = ["sol.guild:40", "sol.hegemony:-35", "sol.compact:10", "sol.ascendancy:10"]
ships_patrol = ["sol.interceptor"]
ships_raider = ["sol.interceptor"]
ships_trader = ["sol.freighter", "sol.shuttle"]
# "System security": the Navy garrisons lanes, it does not run an economy, so
# it is deliberately left NEUTRAL. Keeping one major unbiased means the
# fall-through path stays covered by a shipped asset rather than only by a test.
#
# Law: a hull that has been cut up is evidence before it is cargo, and the Navy
# wants to know whose it was. Licensed, not forbidden - the fleet has no quarrel
# with the breaking trade, only with not knowing.
restricted = ["sol.salvage"]

[[faction]]
id = "sol.guild"
name = "Freight Guild"
description = "Traders and haulers; owns most stations and hates disruption."
color = [0.95, 0.75, 0.2]
kind = "major"
aggression = 0.1
forgiveness = 0.8
relations = ["sol.hegemony:-10", "sol.compact:20"]
ships_patrol = ["sol.interceptor"]
ships_raider = ["sol.interceptor"]
ships_trader = ["sol.freighter", "sol.shuttle"]
# "Owns most stations and hates disruption": the Guild builds what MOVES, so
# it leans to the ends of the chain a hauler is paid to connect - farms that
# ship food out and yards that want metal in - and stays light on the middle.
station_bias = ["sol.station_agri:1.6", "sol.station_factory:1.3",
                "sol.station_refinery:0.7"]

[[faction]]
id = "sol.hegemony"
name = "Ironstar Hegemony"
description = "Authoritarian industrial bloc; believes the lanes should be theirs."
color = [0.75, 0.22, 0.28]
kind = "major"
aggression = 0.7
forgiveness = 0.3
relations = ["sol.compact:-40", "sol.ascendancy:-20"]
ships_patrol = ["sol.interceptor"]
ships_raider = ["sol.interceptor"]
ships_trader = ["sol.freighter", "sol.shuttle"]
# "Authoritarian INDUSTRIAL bloc": heavy industry end to end - it digs, it
# smelts, it fabricates - and it does not feed itself if it can help it.
station_bias = ["sol.station_factory:2.6", "sol.station_refinery:2.2",
                "sol.station_mine:1.5", "sol.station_agri:0.4"]
# Law, and it follows the same prose the bias does. The Ironstar built the hulls
# and it intends to be the one who breaks them: trading in ship remains without
# its licence is theft of its property, and it is the only faction that says so
# outright. Hull plate is materiel and moves under permit.
#
# ⚑ This is the one that makes the feature a feature rather than a table.
# Salvage is what a wreck pays out (Phase 33 stage C), so a pilot who lives by
# killing things earns a hold full of the one good the most heavily policed
# space in the galaxy will not have. That is a route decision, not a rule.
contraband = ["sol.salvage"]
restricted = ["sol.hull_plate"]

[[faction]]
id = "sol.compact"
name = "Frontier Compact"
description = "Settler militias holding the frontier together with sealant and spite."
color = [0.35, 0.8, 0.45]
kind = "major"
aggression = 0.4
forgiveness = 0.6
ships_patrol = ["sol.interceptor"]
ships_raider = ["sol.interceptor"]
ships_trader = ["sol.freighter", "sol.shuttle"]
# "SETTLER militias": settlers feed themselves and dig for what they cannot
# grow. They do not build fabricator yards - that is what they buy from the
# core, and resenting it is most of their politics.
station_bias = ["sol.station_agri:2.4", "sol.station_mine:1.6",
                "sol.station_factory:0.3"]

[[faction]]
id = "sol.ascendancy"
name = "Helios Ascendancy"
description = "Technocratic enclave trading knowledge for distance."
color = [0.6, 0.4, 0.95]
kind = "major"
aggression = 0.25
forgiveness = 0.5
ships_patrol = ["sol.interceptor"]
ships_raider = ["sol.interceptor"]
ships_trader = ["sol.freighter", "sol.shuttle"]
# "TECHNOCRATIC enclave": precision manufacturing, and it buys its raw
# materials rather than scraping them out of its own systems.
station_bias = ["sol.station_factory:2.8", "sol.station_mine:0.35",
                "sol.station_refinery:0.8"]
# Law: an enclave that trades knowledge for distance would rather know exactly
# what mass is arriving. Salvage is uncatalogued mass by definition, so it comes
# in under permit or not at all.
restricted = ["sol.salvage"]

[[faction]]
id = "sol.corsairs"
name = "Corsairs"
description = "Pirate clans working the edges of the shipping lanes."
color = [0.9, 0.2, 0.15]
kind = "pirate"
aggression = 0.8
forgiveness = 0.2
ships_raider = ["sol.interceptor"]
# ⚑⚑ THE FIRST TWO DECLARED-EMPTY CELLS IN THIS GAME (Phase 32 stage C), and
# they are what the description above has said since 8b: clans working the
# edges of the shipping lanes do not run scheduled freight and do not police
# anybody's space. Both cells were populated with the majors' own hulls until
# this stage - byte-identical to the Solar Navy's - so a clan-held system grew
# civilian freighter traffic on a schedule, which is the one thing a lawless
# fringe is not supposed to have.
#
# ⚑ Deleting the two lines would NOT have done this. An empty `ships_trader`
# fell back to `ships_patrol`, so the clans would have hauled in INTERCEPTORS
# rather than not hauled at all - and an empty `ships_patrol` is read by a
# response wing, which for a pirate is not read at all. That is the ambiguity
# `builds_no` exists to remove.
builds_no = ["patrol", "trader"]

[[faction]]
id = "sol.reavers"
name = "Reaver Kindred"
description = "Fringe raiders who treat wrecks as a harvest."
color = [0.95, 0.5, 0.1]
kind = "pirate"
aggression = 0.95
forgiveness = 0.1
ships_raider = ["sol.interceptor"]
# Same declaration as the Corsairs above, for the same reason: raiders who
# treat wrecks as a harvest neither haul nor patrol.
builds_no = ["patrol", "trader"]


# ---------------------------------------------------------------------------
# ⚑⚑⚑⚑ THE BLACK MARKET, AND IT IS A FACTION RATHER THAN A PLACE (Phase 37
# stage B; `decisions/017`, gdd.md §7). No territory, no stations of its own, no
# jurisdiction and no law — it is present wherever a station composed one of
# the four `family = "shadow"` modules, inside somebody else's walls, and the
# nine docks that did are the whole of its address in the shipped galaxy.
#
# ⚑⚑⚑ ONE HAND-AUTHORED FACTION, NOT A TEMPLATE STAMPED LIKE A CLAN (ruled
# 2026-09-01). Every fence in the galaxy is the same people, which is what makes
# the opposed reputation axis ONE number a player can watch move rather than N
# weak ones — and it is why this row is not jittered the way a clan is.
# ---------------------------------------------------------------------------

[[faction]]
id = "sol.ninth_shift"
name = "The Ninth Shift"
description = "The shift that is not on the roster; works every station's back rooms and owns none of them."
# Ashen, and deliberately the least saturated accent in the file: five majors
# and two clan templates all shout, and the one organisation that does not want
# to be seen should not be the brightest marker on a map.
color = [0.55, 0.5, 0.6]
kind = "shadow"
# ⚑⚑⚑ THE FIRST ZERO IN THIS COLUMN, AND IT IS A STATEMENT RATHER THAN A
# TUNING. `aggression` is the bar a faction's decision roll must beat to move
# against somebody's territory; 0 means it never does, ever. That is not a
# safety rail bolted on — `raidCandidates` seeds its search from systems the
# faction HOLDS, so a faction that holds nothing has an empty frontier and can
# reach nowhere. The zero says out loud what the mechanism already guarantees.
aggression = 0.0
# The highest in the file, above the Guild's 0.8: relations drift back to
# baseline fastest between forgiving factions, and a black market does not keep
# grudges. It keeps prices.
forgiveness = 0.9
# ⚑⚑⚑⚑ THESE TWO ROWS ARE THE WHOLE REASON THIS FACTION AUTHORS RELATIONS AT
# ALL, AND THEY FIX A DEFAULT THAT IS WRONG. Unspecified pairs that differ in
# pirate-ness open at -60, and a shadow faction is not a pirate — so without
# these lines the black market would open at open war with every clan in the
# galaxy, which is to say with the people who RUN its fences. Clans inherit
# their template's rows, so two lines cover all ten.
#
# ⚑⚑ AND THE MAJORS ARE DELIBERATELY ABSENT. Shadow-vs-major takes no default
# at all, so every major opens at 0 — not friendly, not at war, no opinion. That
# is exactly right for an organisation whose entire position is that officially
# it does not exist, and it is the number Phase 37 stage E moves.
#
# ⚑ The Corsairs work the shipping lanes and the Ninth Shift moves what comes
# off them; the Reavers treat wrecks as a harvest, which is a ghost dock's
# supply chain described from the other end. The Corsair number is the higher
# of the two because a fence needs cargo more than it needs hulls.
relations = ["sol.corsairs:30", "sol.reavers:25"]
# ⚑⚑⚑ THE FIRST FACTION IN THE GAME TO DECLARE ALL THREE CELLS, AND IT IS THE
# only honest answer. These three rosters are what a faction spawns IN THE
# SPACE IT HOLDS — patrols in its systems, raiders out of them, haulers on a
# schedule between them — and this faction holds no space. Leaving them
# unspecified would warn at load and mean "nobody has decided yet"; saying it
# outright means somebody did.
#
# ⚑⚑ IT WILL HAVE TO BE UN-DECLARED WHEN COVERT HULLS ARRIVE (Phase 37 stage
# D), AND THAT IS THE POINT OF SAYING IT NOW. A cell named here and also listed
# is refused at load, so the day this faction flies something the change is a
# visible edit to this block rather than a roster quietly filling up.
builds_no = ["patrol", "raider", "trader"]
# No `station_bias`: it builds nothing, because it owns nowhere to build it.
# No `contraband` and no `restricted`: those are a JURISDICTION's table, and
# this faction has no jurisdiction. It is the only party in the galaxy with an
# opinion about cargo and no power to act on it, which is what a market is.
