# Outfitting components (Phase 8a). A component occupies exactly one MOUNT on a
# hull (`decisions/014`, gdd.md §11.5), and says which kind of mount and how
# big a one it needs:
#
#   mount = engine | thruster | shield | armor | utility | subsystem | hangar |
#           dock          (the four weapon-taking kinds belong to weapons.toml)
#   size  = small | medium | large | xlarge   (a mount takes its size or under)
#
# ⚑ WHAT PHASE 31 STAGE B DID TO THIS FILE, AND WHAT IT DELIBERATELY DID NOT.
# `slot` became `mount` + `size`, and the mapping REPRODUCES TODAY'S CAPABILITY
# EXACTLY rather than re-balancing under cover of a schema change - the same
# rule stage A2 followed for the hulls:
#
#   old slot "shield"  -> mount = "shield"
#   old slot "engine"  -> mount = "engine"
#   old slot "cargo"   -> mount = "utility"   (gdd.md §11.5 has no cargo kind)
#   old slot "utility" -> mount = "utility"
#
# and EVERY fitting here is `small`, so every one of them still fits every
# shipped hull exactly as it did before mounts. Sizing the Mk2 tier up to
# `medium` - which would make the freighter the only hull that can carry it -
# is a real balance decision and it is NOT this file's to make quietly.
#
# ⚑ ONE kind this content will grow into and has not yet, and it was two.
# `sol.armor_plating` is `utility` rather than `armor` because no shipped hull
# has an `armor` mount. The `subsystem` half of that note is spent: Phase 36
# stage E converted the shuttle's `bay_starboard` into a `covert_bay` and
# authored the family at the bottom of this file. The survey scanners stayed
# `utility` anyway - moving THEM would have taken kit off the starting shuttle
# to make a taxonomy tidier, which is the same reason as before.
#
# ⚑ Was `modules.toml` and `[[module]]` until Phase 31 stage A1. The word
# `module` is now reserved for a station's, which is the noun it fits
# (gdd.md §12). The ids did not change, so a save that names one still loads.
# ⚑⚑ A COMPONENT IS DRAWN ON THE HULL NOW (Phase 31 stage E2), and `model`
# is what it is drawn as. It follows `weapons.toml`'s rule exactly: an EMPTY
# `model` is a bare mount rather than a placeholder box, so a mod's component
# written before this stage still fits and simply leaves the hardpoint clear; a
# model naming something that does not exist falls back to the `fitting` role,
# because that one is a mistake and should be visible.
#
# ⚑ A COMPONENT IN AN INTERNAL MOUNT IS NEVER DRAWN WHATEVER THIS SAYS. That is
# `decisions/014` rule 2 and it belongs to the MOUNT, not to the kit: the same
# shield booster is invisible in the shuttle's `shield_core` and would be drawn
# on a hull that put a shield mount outside. Every component here names a mesh
# for that reason - what is drawn is the mount's business, and a component that
# declined to have a look would be one that could never be fitted externally.
#
# ⚑ THREE MESHES OVER SEVENTEEN COMPONENTS, and the split is by what the kit IS
# rather than by what it costs. A Mk2 shares its Mk1's shape because a tier is a
# stat line the player reads on a screen, not a silhouette they read across
# space; a dish and a container differ because the freighter's five utility
# mounts are the trade stage B made visible, and a trade you cannot see from
# outside the ship is one the outfitting screen has to explain instead.
#
# Modifiers: <stat>_add applies before <stat>_mul; component mass dilutes
# accelerations (mass / (mass + fitted mass)); power_draw sums against the
# ship's power_output. Edits hot-reload into a running dev build.

[[component]]
id = "sol.shield_booster_mk1"
name = "Shield Booster Mk1"
mount = "shield"
size = "small"
model = "pod"
price = 800.0
mass = 400.0
power_draw = 2.0
shield_strength_mul = 1.25

