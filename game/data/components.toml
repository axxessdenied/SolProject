# --- The covert family (Phase 36 stage E) ------------------------------------
#
# ⚑⚑⚑⚑ THE FIRST `subsystem` COMPONENTS IN THE GAME, AND THE HALF `017`
# BOUGHT THE EXPENSIVE SHAPE FOR. That record rejected detection-and-
# consequence-only because "with no stop to survive, a signature dampener is a
# bigger number and nothing else" - so the phase built the stop first (stage C)
# and the verdict second (stage D), and this is the kit that argues with both.
# `signature` multiplies the rate a patrol takes an interest AND divides the
# speed it can read your hold, against a 60 s grant that does not move: a
# dampener does not hide you, it makes them run out of time.
#
# ⚑⚑ COVERT COMPONENTS, NOT COVERT HULLS, AND THE SPEC SAYS SO IN AS MANY
# WORDS. Phase 32 ruling 11 left `HullRole` deliberately unread vocabulary and
# nothing here changes that. `ShipDef::signature` is authorable so a covert
# hull family can be quiet before a component is bought; no shipped hull uses
# it, and the day one does it is a data pass rather than a phase.
#
# ⚑ WHY THESE ARE NOT `utility`. Every other fitting in this file is, because
# no shipped hull had a `subsystem` mount worth the name (see ships.toml's own
# note). Stage E converted the shuttle's `bay_starboard` into a `covert_bay`
# for exactly this content, which is what makes the kind a real place rather
# than a taxonomy: a dampener is not competing with a cargo pod for a hull's
# skin, it is competing with it for the hull.
#
# ⚑ Models are named though a subsystem is NEVER DRAWN (`decisions/014` rule 2
# - what is drawn is the mount's business, not the kit's). The file's rule is
# that every component names a mesh it could be drawn as, so that one authored
# externally on somebody's mod hull is a fitting and not a bare mount.

[[component]]
id = "sol.signature_dampener_mk1"
name = "Signature Dampener Mk1"
mount = "subsystem"
size = "small"
model = "pod"
price = 3200.0
mass = 300.0
power_draw = 2.0
signature_mul = 0.6

# ⚑⚑ THE FLOOR IS 0.35 AND THIS IS IT, WHICH IS DELIBERATE AND IS NOT A
# CEILING WORTH RAISING. `SpaceWorld::kMinSignature` clamps what any fit can
# reach, because a signature of zero is the inspection mechanic switched off
# from a data file. At 0.35 a dark ship inside a patrol's envelope is still
# stopped - roughly every 95 s instead of every 33 - and the read takes 34 s
# against a 60 s hold, so the stop is survivable rather than absent.
#
# ⚑ `min_rep` rather than a `factions` allowlist. Anyone will sell you a
# dampener; not everyone will sell you the good one. A fence that stocks what
# no lawful outfitter will is Phase 37's whole subject, and pre-empting it here
# with a clan-only key would be this phase authoring that one's content.
#
# ⚑⚑⚑⚑ PHASE 37 STAGE C IS THAT PHASE AND IT ADDED THE ALLOWLIST, WHICH FIXES
# AN ACCIDENT PHASE 36 RECORDED RATHER THAN INVENTING A RULE. `stationSells`
# short-circuits on `faction.pirate()` BEFORE it reads `min_rep`, so with no
# allowlist this - the strongest countermeasure in the game - was sold to a
# stranger at every clan station in the galaxy and refused to a decorated
# veteran in the core. Naming the black market makes the lawful counter refuse
# it everywhere, and the fence the only place it is sold.
#
# ⚑⚑⚑ AND THE `min_rep` NOW READS AGAINST THE NINTH SHIFT'S STANDING, WHICH IS
# ZERO FOR EVERY PLAYER AND WHICH NOTHING IN THE GAME MOVES UNTIL PHASE 37
# STAGE E. That is deliberate and was ruled 2026-09-01 with the cost stated: this
# row is VISIBLE AND REFUSED, with its price in standing named on the row, and
# it is the one locked door in the game. The alternative was shipping the fence
# with nothing to want. ⚑ If stage E slips, this line is the thing to revisit -
# a permanently unbuyable row is dead content, and it is only not dead because
# the next stage is what opens it.
[[component]]
id = "sol.signature_dampener_mk2"
name = "Null Signature Suite"
mount = "subsystem"
size = "small"
model = "pod"
price = 11000.0
mass = 520.0
power_draw = 3.5
signature_mul = 0.35
factions = ["sol.ninth_shift"]
min_rep = 25.0

# ⚑⚑ THE THIRD LEG OF THE TRADE, AND IT MOVES NO NEW STAT. A `covert_bay` that
# only ever held a dampener would be a slot with one right answer; this makes
# the choice a real one for a pilot who does not smuggle - it is the survey
# scanner's stat line moved indoors, so an explorer spends the same mount on
# reaching further instead of on being read slower.
#
# ⚑ It is the "early-warning sensor" of `017`'s covert family, named for what
# it does with the machinery this game has: a longer pulse is how you see a
# picket before it sees you, and `NoticeParams::range` is 80 km against a pulse
# measured in hundreds of thousands. Nothing new was needed for that to be
# true, which is why it is data.
[[component]]
id = "sol.threat_scanner"
name = "Threat Scanner"
mount = "subsystem"
size = "small"
model = "dish"
price = 2600.0
mass = 260.0
power_draw = 2.0
scan_range_mul = 1.5
scan_speed_mul = 1.2
