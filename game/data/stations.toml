# Station archetypes: placement weights per region tier feed the galaxy
# generator; the rate lists feed the market sim.
#
# Inputs come in two kinds (Phase 8g), and the split is what makes the chain
# a chain without letting it deadlock:
#   feedstock - the thing the station transforms. Production is throttled by
#               how much of it is on hand, so a refinery with no ore makes no
#               metal and a shortage travels down the chain.
#   consumes  - upkeep. Burned regardless, never gates production. The
#               production graph is a cycle (food -> ore -> metal ->
#               machinery -> food), so if every input gated output a single
#               empty link could seize the whole galaxy permanently.
# produces_from = "field" means the output comes out of the ground rather
# than off anyone's dock: a Mining Outpost draws ore from the asteroid fields
# in its own system, so a system with no rock supports no mine.
#
# The rates below are sized against what the trader fleet can actually move
# (see EconomyParams), and every producer is deliberately run about a quarter
# ahead of its customers. That slack is not waste, it is stability: a station
# with nowhere to put its output stops producing, so an economy balanced to
# the last decimal ratchets downward - one delivery arrives late, a producer
# glutts, its output stops, the next link starves, and it never recovers.
# Surplus means gluts are just cheap goods, which is what a trader wants
# anyway.
#
# ---------------------------------------------------------------------------
# ⚑⚑⚑⚑ THE OLD CHAIN'S THROUGHPUT WAS SIZED AGAINST A STATION MIX THAT DOES
# NOT EXIST, AND EVERY INSTRUMENT IN THIS PROJECT AGREED WITH IT (Phase 33
# stage E). `economy_no_commodity_is_made_much_faster_than_it_is_burnt` counts
# stations in a galaxy built from THIS FILE'S WEIGHTS AND NOTHING ELSE. The
# game does not build that galaxy. Since Phase 13 `factions.toml` carries
# `station_bias`, a per-faction multiplier on the region weight below - up to
# x2.8 - and the generator applies it wherever a faction holds territory. So
# the mix the guard scores and the mix a player flies through are two different
# galaxies, and stages B and C both tuned this file against the wrong one.
#
#   guard's galaxy   agri 15  mine 16  refinery 18  factory 13  ferrous 13  foundry 15  fabworks 13  breaker 10  plant 11
#   the real one     agri 19  mine 14  refinery 13  factory 17  ferrous 14  foundry 16  fabworks 13  breaker  9  plant 10
#
# ⚑⚑⚑ THE HEGEMONY BUILDS FACTORIES AT x2.6 AND THE ASCENDANCY AT x2.8, AND
# NOBODY BIASES A REFINERY UP - so the real galaxy runs 17 Fabricator Yards
# against 13 Refineries where the guard's runs 13 against 18. Metal came out at
# 0.561 made-to-burnt in the shipped galaxy: every Fabricator Yard in the game
# permanently feedstock-throttled, machinery behind it, and NO TEST IN THE
# REPOSITORY COULD SEE IT. Food (1.683) and raw ore (1.774) were over the
# ceiling for the mirror of the same reason.
#
# ⚑⚑ WHY IT HID FOR TWO STAGES: THE MIRROR WAS KEPT IN STEP WITH THE FILES IT
# IS A MIRROR OF. `economy_tests.cpp` transcribes `commodities.toml` and this
# file by hand, and it was faithfully updated by both stages. `station_bias`
# lives in NEITHER of them - it is a third file that moves the same numbers, and
# nothing ever said so. ⚑ *A hand-kept mirror is only as wide as the list of
# files somebody remembered to mirror.*
#
# ⚑⚑ WHAT CHANGED HERE IS THROUGHPUT ONLY. Every conversion ratio and every
# value margin in `commodities.toml` is preserved to the digit - the Refinery
# still turns ore into metal at 0.65 and clears +72%, the Fabricator Yard still
# runs at 0.80 and clears +30% - because the ratios were never what was wrong.
# What was wrong is how MUCH each station moves, and that was sized per station
# against a count that is off by four stations in both directions. Placement
# weights are untouched, so the galaxy is the same place and the golden
# structure digest does not move.
# ---------------------------------------------------------------------------

# ⚑⚑⚑ THE ONE ROW PHASE 34 STAGE B RE-STATED RATHER THAN LEFT ALONE, AND THE
# CHANGE IS GROSS-FOR-NET WITH THE SAME FARM AT THE END OF IT. This archetype
# read `produces 0.26, consumes nothing` because food upkeep was a flat
# per-station line and a farm was exempt from it. Habitat modules own that line
# now (ruled 2026-08-31), and a farm with nobody living on it is a worse world
# than a different number - so the dome produces 0.32 GROSS and the station's own
# habitat eats 0.06 of it in expectation, leaving the 0.26 net this row has
# always meant. NET food per farm is identical to the digit; the galaxy's food
# MADE and BURNT each rise by about 1.0/s, which moves the made-to-burnt ratio
# from 1.056 to about 1.045 - measured, in band, and printed by the content
# guard rather than argued here.
# ⚑ Its bulk hold was pinned to certainty by Phase 34 stage D. The dome's
# tractor bill is `sol.machinery`, which is bulk, and at chance 0.5 half of the
# galaxy's seventeen farms burnt a good they had no warehouse for. A station has
# to be able to hold what its own modules touch — the cryo hold below is the
# farm's surplus, and the larder its people eat out of rides on the habitat.
[[station]]
id = "sol.station_agri"
name = "Agricultural Station"
weight_core = 1.0
weight_frontier = 1.5
weight_fringe = 0.5
produces = ["sol.food:0.32"]
consumes = ["sol.machinery:0.075", "sol.food:0.06"]
stock_capacity = 2500
modules = [
    "sol.mod_agri_dome",
    "sol.mod_habitat_ring",
    "sol.mod_barracks:0.5",
    "sol.mod_cryo_hold",
    "sol.mod_bulk_hold",
    "sol.mod_docking_control",
    "sol.mod_market_floor:0.9",
    "sol.mod_mission_board:0.5",
    "sol.mod_crew_hall:0.35",
    "sol.mod_bar:0.5",
    "sol.mod_restaurant:0.3",
    "sol.mod_outfitter:0.2",
    "sol.mod_ship_sales:0.05",
]

