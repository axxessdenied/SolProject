# Station archetypes: placement weights per region tier feed the galaxy
# generator; the rate lists feed the market sim.
#
# Inputs come in two kinds (Phase 8g), and the split is what makes the chain
# a chain without letting it deadlock:
#   feedstock - the thing the station transforms. Production is throttled by
#               how much of it is on hand, so a refinery with no ore makes no
#               metal and a shortage travels down the chain.
#   consumes  - upkeep. Burned regardless, never gates production. The
#               production graph is a cycle (food -> ore -> metal ->
#               machinery -> food), so if every input gated output a single
#               empty link could seize the whole galaxy permanently.
# produces_from = "field" means the output comes out of the ground rather
# than off anyone's dock: a Mining Outpost draws ore from the asteroid fields
# in its own system, so a system with no rock supports no mine.
#
# The rates below are sized against what the trader fleet can actually move
# (see EconomyParams), and every producer is deliberately run about a quarter
# ahead of its customers. That slack is not waste, it is stability: a station
# with nowhere to put its output stops producing, so an economy balanced to
# the last decimal ratchets downward - one delivery arrives late, a producer
# glutts, its output stops, the next link starves, and it never recovers.
# Surplus means gluts are just cheap goods, which is what a trader wants
# anyway.

[[station]]
id = "sol.station_agri"
name = "Agricultural Station"
weight_core = 1.0
weight_frontier = 1.5
weight_fringe = 0.5
produces = ["sol.food:0.26"]
consumes = ["sol.machinery:0.11"]
stock_capacity = 2500

[[station]]
id = "sol.station_mine"
name = "Mining Outpost"
weight_core = 0.5
weight_frontier = 1.5
weight_fringe = 2.0
produces = ["sol.ore:0.28"]
produces_from = "field"
consumes = ["sol.food:0.05", "sol.hull_plate:0.013"]
stock_capacity = 2500

# Sited where the rock is, not where the customers are: raw ore is bulk and
# cheap, so hauling it to the core costs more than it is worth, and the whole
# ore leg jams when a mine's nearest buyer is five jumps away. Smelt at the
# pit and ship the metal - which is compact, valuable, and what the core
# factories actually want.
[[station]]
id = "sol.station_refinery"
name = "Refinery"
weight_core = 0.4
weight_frontier = 1.6
weight_fringe = 1.7
produces = ["sol.metal:0.11"]
feedstock = ["sol.ore:0.17"]
consumes = ["sol.food:0.035", "sol.hull_plate:0.013"]
stock_capacity = 2500
refine_input = "sol.ore"
refine_output = "sol.metal"

[[station]]
id = "sol.station_factory"
name = "Fabricator Yard"
weight_core = 2.0
weight_frontier = 1.0
weight_fringe = 0.3
produces = ["sol.machinery:0.12"]
feedstock = ["sol.metal:0.15"]
consumes = ["sol.food:0.05", "sol.hull_plate:0.013"]
stock_capacity = 2500

# ---------------------------------------------------------------------------
# The ferrous chain (Phase 33 stage B): ferrous ore -> structural alloy ->
# hull plate -> a fitting somebody bolts to a ship. Three archetypes, laid out
# to mirror the three that already make the metal chain, because that shape is
# TUNED and copying it is cheaper than re-deriving it.
#
# ⚑⚑⚑ STATION COUNT IS FIXED AT 124 WHATEVER THIS FILE SAYS, SO THREE NEW
# ARCHETYPES TAKE STATIONS AWAY FROM THE OLD FOUR - AND THE MIX SHIFTS EVEN
# THOUGH NOT ONE OF THEIR WEIGHTS WAS TOUCHED. Measured at seed 1701:
#
#   before   agri 22   mine 33   refinery 43   factory 26
#   after    agri 18   mine 17   refinery 22   factory 18   + 18 / 20 / 11 new
#
# ⚑⚑ THE OBVIOUS REASONING FOR WHY THAT WOULD BE SAFE IS WRONG, AND IT WAS
# WRITTEN HERE BEFORE IT WAS MEASURED. The generator picks by RELATIVE weight
# within a region tier, so leaving the old four alone does shrink them by a
# common factor - PER TIER. It does not do so in aggregate, because the three
# new rows are not spread evenly across core, frontier and fringe: they sit
# outward, where the Mining Outpost and the Refinery live, so those two lost
# half their stations while the core-weighted Fabricator Yard lost a third.
#
# ⚑⚑ WHAT THAT COSTS IS ONE RATIO, AND IT IS MEASURED RATHER THAN ARGUED.
# Refined metal is now made at 0.90x the rate it is burnt where it was 1.21x, so
# it settles lower and Fabricator Yards run slightly feedstock-throttled - which
# is what `satisfaction` is for and what `feedstock` gating exists to do. Ninety
# six sim hours were run to find out where it stops: metal falls from 0.478 to
# 0.246 fill and is still decelerating, no commodity is starved at any station
# at any point, and every bound `economy_shipped_rates_hold_a_steady_state`
# checks holds at twenty-four times its own horizon.
# `economy_no_commodity_is_made_much_faster_than_it_is_burnt` is the cheap guard
# that came out of that run: it counts stations and multiplies, and it would
# have found in milliseconds what ten minutes of simulation had to show.
#
# ⚑⚑ THE ONE PLACE THAT DOES NOT COVER, AND IT IS AN UPKEEP LINE ON EACH OF
# THE OLD ROWS: hull plate has to be BURNT by somebody or a Fabrication Works
# gluts and stops, and the honest consumer of structural plate is heavy industry
# maintaining itself. Mining Outpost, Refinery and Fabricator Yard each burn
# 0.013/s of it; the Agricultural Station does not, because a farm is not a
# machine shop. Upkeep never gates production (see the header), so the worst a
# plate shortage can do is leave a station hungry - it cannot seize the chain.
#
# ⚑ AND THE NEW ROWS EAT LESS FOOD THAN THE OLD ONES (0.015 against 0.05). Not
# thrift: with 124 stations fixed, three new archetypes are three new mouths at
# a table where the number of farms went DOWN. At the old rate the food surplus
# fell from 1.55x to 1.12x, which is inside the band and outside the margin the
# header calls stability rather than waste.
# ---------------------------------------------------------------------------

# Sited outward, like the Mining Outpost and further: ferrous rock is scarce in
# the core by `commodities.toml`'s ore weights, so a mine put there would draw
# against a field that mostly is not ferrous and produce a fraction of its rate
# however hard it worked. The weights and the ore weights say the same thing
# twice, on purpose - one decides where the stations go, the other decides
# whether there is anything under them.
[[station]]
id = "sol.station_ferrous"
name = "Ferrous Mine"
weight_core = 0.3
weight_frontier = 0.9
weight_fringe = 1.2
produces = ["sol.ore_ferrous:0.20"]
produces_from = "field"
consumes = ["sol.food:0.015", "sol.hull_plate:0.013"]
stock_capacity = 2500

# Smelt at the pit, exactly as the Refinery does and for the identical reason:
# ferrous ore is bulk and cheap, alloy is compact and valuable, and the leg that
# should cross the galaxy is the second one.
[[station]]
id = "sol.station_foundry"
name = "Foundry"
weight_core = 0.25
weight_frontier = 1.0
weight_fringe = 1.0
produces = ["sol.alloy:0.085"]
feedstock = ["sol.ore_ferrous:0.13"]
consumes = ["sol.food:0.015", "sol.hull_plate:0.013"]
stock_capacity = 2500

# Core-weighted like the Fabricator Yard: the last industrial step wants to be
# near the customers, and for this chain the customer is a hardpoint on a ship.
# It burns no hull plate of its own - a station consuming its own output is a
# feedback loop, not an upkeep line.
[[station]]
id = "sol.station_fabworks"
name = "Fabrication Works"
weight_core = 1.2
weight_frontier = 0.6
weight_fringe = 0.2
produces = ["sol.hull_plate:0.12"]
feedstock = ["sol.alloy:0.15"]
consumes = ["sol.food:0.015"]
stock_capacity = 2500

# ---------------------------------------------------------------------------
# The salvage leg (Phase 33 stage C): a dead hull -> salvage -> structural
# alloy, which is the alloy the Fabrication Works already turns into plate. Two
# archetypes, and they are deliberately a MINOR leg - twelve or so stations
# between them against the ferrous chain's fifty.
#
# ⚑⚑⚑ THE RECLAMATION PLANT MAKES `sol.alloy` AND NOT A `sol.alloy_reclaimed`,
# AND THAT IS THE STAGE'S ONE REAL DESIGN DECISION. A reclaimed good that cannot
# stand in for the original is not recycling, it is a parallel economy with its
# own dead end - and the exit this stage is written against is "a wreck's
# salvage RE-ENTERS INDUSTRY", which is a claim about the good it becomes. The
# cost of the decision is that alloy now has two producers and has to be tuned
# as one supply; the benefit is that a wreck cut in the fringe ends up as plate
# on somebody's hull without a second chain being invented to carry it.
#
# ⚑⚑ A BREAKER YARD PRODUCES OUT OF NOTHING, EXACTLY AS THE AGRICULTURAL
# STATION DOES, and that is honest rather than a shortcut: a farm's input is
# sunlight and a breaker yard's is the derelict hulls that are towed in, and
# neither is a good this economy models. What would be dishonest is
# `produces_from = "field"`, which means "out of the rock in this system" and is
# read by the generator as a siting requirement - salvage is not in the rock.
#
# ⚑ THE PLAYER MEETS THIS LEG THROUGH THE RECLAMATION PLANT'S REFINING SERVICE,
# not through its market. `refine_input`/`refine_output` is the one mechanism in
# the game that takes a commodity off the player's hands and hands back another,
# so a pilot who cut up what they killed can walk it in and get alloy for it.
# That is the whole chain in one dock, and it is the first thing to fly.
#
# ⚑⚑⚑⚑ STAGE B MEASURED THE MIX SHIFT AND ACCEPTED IT. STAGE C MEASURED IT
# AGAIN AND FOUND IT IS NOT A SHIFT, IT IS CHAOS - AND THE DIFFERENCE MATTERS.
# Stage B's note above reasons that adding archetypes shrinks the old rows by a
# common factor per region tier, and corrects itself to "not in aggregate,
# because the new rows sit outward". Both halves of that are still true and
# neither is enough: adding these two archetypes moved the MINING OUTPOST UP,
# from 17 stations to 19, while the Refinery it feeds fell from 22 to 17.
#
#   stage B          agri 18  mine 17  refinery 22  factory 18  ferrous 18  foundry 20  fabworks 11
#   first cut here   agri 15  mine 19  refinery 17  factory 13  ferrous 16  foundry 21  fabworks  9  + 10 breakers,  4 plants
#   shipped          agri 15  mine 16  refinery 18  factory 13  ferrous 13  foundry 15  fabworks 13  + 10 breakers, 11 plants
#
# The generator places station by station out of a per-system draw, so two new
# rows do not scale the old ones - they RESAMPLE them, and a tenth of a point on
# a new row's weight moves an unrelated old row by several stations. There is no
# argument that gets from a weight to a count here. There is only running it.
#
# ⚑⚑⚑ WHICH IS WHY THE FIRST CUT AT THIS FILE FAILED THREE RATIOS AND TWO OF
# THEM WERE ON THE OLD CHAIN THIS STAGE NEVER TOUCHED. Raw ore came out at 1.84
# made-to-burnt (19 mines feeding 17 refineries) and hull plate at 0.83 (9
# Fabrication Works against a hundred stations' upkeep) - both of them purely
# because the station mix resampled, and neither of them anything to do with
# salvage. `economy_no_commodity_is_made_much_faster_than_it_is_burnt` printed
# all three in milliseconds. Stage B wrote that guard after ten minutes of
# simulation had to show it what a count sheet says instantly; this is the stage
# where it paid for itself, and it is now the thing this file is tuned AGAINST
# rather than a check run afterwards.
#
# ⚑⚑ SO THE SHAPE OF THESE TWO ROWS IS A DESIGN STATEMENT AND THEIR MAGNITUDES
# ARE A SEARCH RESULT, AND SAYING SO IS MORE HONEST THAN PRETENDING OTHERWISE. A
# breaker yard belongs outward and a reclamation plant belongs inward - that is
# fiction, it is argued above, and the search was constrained to obey it. Which
# outward and which inward, out of the hundreds of triples that satisfy it, was
# picked by generating the galaxy for each and keeping the one whose station
# counts leave every commodity in the galaxy nearest the middle of the guard's
# band. Nobody has an independent opinion about 0.6 against 0.5, and inventing
# one would have been the same mistake stage B made with a comment.
# ---------------------------------------------------------------------------

# Sited outward, where the hulls actually die: the fringe is where raiding and
# contested space are, and nobody puts a scrapyard in a core system if they can
# help it.
[[station]]
id = "sol.station_breaker"
name = "Breaker Yard"
weight_core = 0.2
weight_frontier = 0.6
weight_fringe = 0.7
produces = ["sol.salvage:0.17"]
consumes = ["sol.food:0.015", "sol.hull_plate:0.013"]
stock_capacity = 2500

# Core-leaning, because its output is alloy and alloy's customer is the
# Fabrication Works - the same argument that sites the Foundry at the pit sites
# this one at the customer, and for the opposite reason: salvage is bulk, but a
# breaker yard is where the bulk already is, and what has to cross the galaxy is
# whichever leg is shorter to move. Reclaimed alloy is compact.
[[station]]
id = "sol.station_recycler"
name = "Reclamation Plant"
weight_core = 1.1
weight_frontier = 0.9
weight_fringe = 0.3
produces = ["sol.alloy:0.085"]
feedstock = ["sol.salvage:0.13"]
consumes = ["sol.food:0.015", "sol.hull_plate:0.013"]
stock_capacity = 2500
refine_input = "sol.salvage"
refine_output = "sol.alloy"
