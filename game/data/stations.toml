# ---------------------------------------------------------------------------
# T3, the construction tier (Phase 33 stage E): machinery + hull plate -> a hull
# section -> a ship somebody flies away in. Two archetypes, and the second one
# is the unusual one.
#
# ⚑⚑⚑⚑ THE SHIPYARD PRODUCES NOTHING, AND THAT IS THE HONEST SHAPE RATHER THAN
# A GAP. A farm's input is sunlight and a Breaker Yard's is the derelict hulls
# towed in, and this file already says neither is a good this economy models -
# both produce out of nothing. A Shipyard is the same statement at the other
# end: its output is SHIPS, which leave the economy under their own power and
# are not a commodity either. T3 is where the tree stops, because what the
# construction tier constructs is not tradeable - and a tier that terminates in
# a warehouse would not have been a construction tier at all.
#
# ⚑ `Economy::produce` handles it without a special case: `ratio` is set by the
# scarcest feedstock whether or not anything is produced, and feedstock is spent
# in proportion to it, so a Shipyard short of sections simply builds fewer
# ships. Nothing else in the sim reads an archetype's production - traders route
# on price and stock - so a pure sink is a station like any other.
#
# ⚑⚑ THE ASSEMBLY YARD IS THE FIRST STATION IN THE GAME WITH TWO FEEDSTOCKS,
# which is what makes this T3 rather than a second T2. `Economy::produce` has
# taken the minimum over every feedstock since Phase 8g - "the scarcest
# feedstock (a station with none runs flat out)" - and no shipped archetype had
# ever reached that branch. An Assembly Yard is throttled by whichever of
# machinery and hull plate is shorter, so it is the first place a shortage on
# the metal chain can be felt on the ferrous one.
#
# ⚑⚑⚑ AND THE MIX RESAMPLED AGAIN, FOR THE THIRD STAGE RUNNING, THIS TIME OFF A
# CORRECTED BASE. The prerequisite commit taught the guards to count the galaxy
# the game builds; these two rows then moved that galaxy again:
#
#   stage E base   agri 19  mine 14  refinery 13  factory 17  ferrous 14  foundry 16  fabworks 13  breaker  9  plant 10
#   stage E ship'd agri 17  mine 15  refinery 12  factory 10  ferrous 10  foundry 11  fabworks 13  breaker 11  plant 12  + 6 assembly, 8 shipyard
#   TODAY          agri 17  mine 15  refinery 12  factory 12  ferrous 11  foundry 13  fabworks 12  breaker 11  plant 11  + 6 assembly, 5 shipyard
#
# The FABRICATOR YARD lost seven stations, 17 to 10, to two archetypes weighted
# like the Fabrication Works and not like it. The Reclamation Plant went UP
# again. There is still no argument that gets from a weight to a count.
#
# ⚑⚑⚑ AND THAT `shipped` ROW THEN WENT STALE ONE COMMIT LATER - THE WARNING
# BELOW HAPPENING TO THIS COMMENT. The Hegemony bloc re-searched both T3 weight
# triples (1.6/0.6/0.2 -> 1.3/0.45/0.2) so that the shipped galaxy and the
# `economy_tests.cpp` mirror would agree on the Assembly/Shipyard split, and
# that resampled SIX of the eleven counts - the Shipyard from 8 to 5, the
# Fabricator Yard back UP from 10 to 12 - while leaving the total at 125, which
# is exactly why nobody noticed. The TODAY row is the measured one: it
# reproduces the ratios that commit recorded (1.04-1.39 across all nine goods),
# while the stage E row puts `sol.hull_section` at 0.694, under the guard's 0.85
# floor. ⚑ A count sheet in a comment is a measurement with no test behind it;
# the ones with a test behind them are in `economy_content_tests.cpp`.
#
# The weights below are a design statement in their SHAPE and a search result in
# their MAGNITUDE, exactly as stage C's were: an Assembly Yard belongs where the
# components are, which is inward, and a Shipyard belongs beside it, because a
# hull section is the bulkiest thing in the game and the leg that should be
# short is that one. Which inward, out of the triples that satisfy it, was
# picked by generating the shipped galaxy for each candidate and keeping the mix
# that leaves every commodity nearest the middle of the guard's band.
#
# ⚑⚑⚑⚑ AND THE SEARCH SAID SOMETHING NO EARLIER STAGE'S DID: AT THE FIRST CUT'S
# RATES, THE ONLY IN-BAND GALAXIES WERE THE ONES WITH ALMOST NO T3 IN THEM. A
# sweep over the whole weight grid returned exactly three candidates that put
# every commodity in band, and all three placed ONE Assembly Yard - the tier
# could exist only by barely existing. That is not a weight problem and no
# weight could have fixed it: taking ten stations out of an eleven-archetype
# galaxy left refined metal at 1.745 (twelve Refineries against ten Fabricator
# Yards) and machinery at 0.772 in the same breath, one over the ceiling and one
# under the floor, on the chain this stage does not touch.
#
# ⚑⚑⚑ SO THE FABRICATOR YARD'S THROUGHPUT MOVED AGAIN, ONE COMMIT AFTER THE
# PREREQUISITE SET IT - 0.125 metal / 0.10 machinery to 0.19 / 0.152, the 0.80
# conversion and the +30% margin preserved as before. It is the same station
# absorbing both errors because it sits between them: it is refined metal's only
# consumer and machinery's only producer, so widening it lowers one ratio and
# raises the other with one number. ⚑ *A rate is not tuned once. It is tuned per
# station count, and the station count is resampled by every archetype anybody
# adds - which is exactly what the prerequisite commit's guard now measures.*
# ---------------------------------------------------------------------------

# Where the components are: machinery comes off a Fabricator Yard and hull plate
# off a Fabrication Works, and both of those are core-weighted. An Assembly Yard
# put in the fringe would be hauling two feedstocks the length of the galaxy to
# make one output - the exact inversion of the argument that smelts ore at the
# pit.
[[station]]
id = "sol.station_assembly"
name = "Assembly Yard"
weight_core = 1.3
weight_frontier = 0.45
weight_fringe = 0.2
produces = ["sol.hull_section:0.025"]
feedstock = ["sol.machinery:0.030", "sol.hull_plate:0.035"]
consumes = ["sol.food:0.035"]
stock_capacity = 2500
modules = [
    "sol.mod_assembly_line",
    "sol.mod_habitat_ring:0.5",
    "sol.mod_barracks:0.5",
    "sol.mod_bulk_hold",
    "sol.mod_docking_control",
    "sol.mod_market_floor:0.8",
    "sol.mod_outfitter:0.5",
    "sol.mod_ship_sales:0.35",
    "sol.mod_drydock:0.4",
    "sol.mod_mission_board:0.6",
    "sol.mod_crew_hall:0.5",
    "sol.mod_bar:0.45",
    "sol.mod_restaurant:0.25",
    "sol.mod_brokerage:0.25",
]

# Beside the Assembly Yard rather than out where the ships are needed, because a
# hull section is the bulkiest thing this economy moves and a finished ship
# moves itself. It burns hull plate as upkeep like the rest of heavy industry
# and unlike the Assembly Yard, whose plate line is feedstock already - a
# station cannot sensibly have the same good on both lists.
[[station]]
id = "sol.station_shipyard"
name = "Shipyard"
weight_core = 1.3
weight_frontier = 0.45
weight_fringe = 0.2
feedstock = ["sol.hull_section:0.027"]
consumes = ["sol.food:0.035", "sol.hull_plate:0.013"]
stock_capacity = 2500
modules = [
    "sol.mod_shipyard",
    "sol.mod_habitat_ring:0.4",
    "sol.mod_barracks:0.5",
    "sol.mod_medical_bay:0.5",
    "sol.mod_bulk_hold",
    "sol.mod_docking_control",
    "sol.mod_ship_sales:0.95",
    "sol.mod_outfitter:0.8",
    "sol.mod_drydock:0.7",
    "sol.mod_market_floor:0.6",
    "sol.mod_mission_board:0.7",
    "sol.mod_crew_hall:0.6",
    "sol.mod_bar:0.55",
    "sol.mod_restaurant:0.4",
    "sol.mod_concourse:0.3",
    "sol.mod_casino:0.1",
    "sol.mod_brokerage:0.3",
]
