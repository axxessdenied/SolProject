# Station archetypes: placement weights per region tier feed the galaxy
# generator; produces/consumes ("commodity:units_per_second") feed the
# market sim. The three archetypes form a production triangle -
# food -> mines, ore -> factories, machinery -> farms - so trade routes
# exist everywhere.

[[station]]
id = "sol.station_agri"
name = "Agricultural Station"
weight_core = 1.0
weight_frontier = 1.5
weight_fringe = 0.5
produces = ["sol.food:3.0"]
consumes = ["sol.machinery:0.5"]

[[station]]
id = "sol.station_mine"
name = "Mining Outpost"
weight_core = 0.5
weight_frontier = 1.5
weight_fringe = 2.0
produces = ["sol.ore:2.5"]
consumes = ["sol.food:1.2"]

[[station]]
id = "sol.station_factory"
name = "Fabricator Yard"
weight_core = 2.0
weight_frontier = 1.0
weight_fringe = 0.3
produces = ["sol.machinery:1.5"]
consumes = ["sol.ore:2.0", "sol.food:0.8"]
