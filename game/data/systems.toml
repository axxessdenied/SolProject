# Places somebody put somewhere (Phase 29). Everything else in the galaxy is
# rolled from the seed; a `[[system]]` row is a place a person decided on, and
# its `id` is the only handle anything - a campaign script, a mission, another
# def - has on a particular place. Procedural names are drawn AFTER placement,
# so they are a fact about one seed at one system count and nothing can rely on
# them. An id is forever.
#
# THE WHOLE SCHEMA, in the order it reads:
#
#   id             required, and yours. `sol.system_by_id("<id>")` in Lua
#                  returns the galaxy index, or -1.
#   placement      how the generator chooses which node this becomes:
#                  "random"     an ordinary node somewhere (the default)
#                  "anywhere"   a NEW node at a new map position; this one
#                               grows the galaxy rather than taking a slot
#                  "at_system"  the capital of a faction, named in a sibling
#                               `at_system = "<faction id>"` key
#                  "jumps_from" a ring of gate distance around an EARLIER
#                               authored system, in a sibling
#                               `jumps_from = { system = "…", min = 2, max = 4 }`
#   name           what it is called. Omit it and the generator rolls one.
#   region         "core" | "frontier" | "fringe". Omit it and the map radius
#                  decides, the same way it does for every other system.
#   faction        a [[faction]] id: who holds it. Mutually exclusive with…
#   lawless        …`lawless = true`, which is NOT the absence of `faction`:
#                  it is an authored "nobody", and the pirate-clan pass leaves
#                  it alone rather than handing it to whoever is nearest.
#   primary_planet index into the [[system.planet]] rows below; the hub the
#                  playfield is laid out around.
#   security       how hard this place is held, 0 to 1. Omit it and the
#                  generator's own curve decides, from region and how many
#                  gate jumps the owner's seat of power is away. Write it and
#                  a fortress can sit on the rim, or a core system can be one
#                  nobody bothers to police any more.
#   secret         a placement flag and nothing else yet.
#
# ⚑ `security` IS A MAGNITUDE AND THE SIGN IS NOT YOURS. The rating a player
# reads is signed - `sol.security(i)` prints "+0.85" for a Navy core system and
# "-0.75" for a pirate clan's home - because the sign says WHO polices the
# place rather than how much. Who holds a system is the galaxy's business, so
# the generator takes the sign from the owner and you write only the strength.
# A negative here is refused by name. Zero is legal and means what it says on
# the map: nobody comes, and you are on your own.
#
# Every field is optional except `id`. A row that names only a station and a
# placement rule is legal and useful: what you leave out is filled in
# procedurally, and what you write is never overwritten.
#
# ⚑ EDITING THIS FILE NEEDS A RESTART. Def hot-reload reaches the parser and
# deliberately not the galaxy - re-placing systems under a running campaign
# would move the player's own system out from under them. A save also records
# a digest of this content and refuses to load against a different one, which
# is the same rejection a save from another build already gets.
#
# ⚑ A MOD ADDS PLACES THE SAME WAY, in its own `systems.toml`, with no change
# to this file. `game/mods/example-systems/` is a worked example carrying a
# `[[constellation]]` - a group of systems placed together, keeping the lanes
# their author drew between them - and it is deliberately NOT in the shipped
# package (docs/decisions/018).

# ⚑ Until the Phase 33 exit flight this was the ONLY authored place the base
# game shipped, and the sentence below said so. It is still the only one placed
# `anywhere` - the only one that GROWS the galaxy rather than taking a slot -
# and still the clearest example in the file, so it keeps its place at the top.
#
# Here to be an example more than to be content: one system, `anywhere`, so it
# takes nothing away from the eighty the seed produces.
#
# It is also the only system in the galaxy that nobody owns. Every other
# unclaimed system ends up belonging to a pirate clan, because `spawnClans`
# hands each connected neighbourhood of lawless systems to one - `lawless =
# true` here says a person decided that, so the pass leaves it alone.
[[system]]
id = "sol.lantern"
name = "Lantern"
placement = "anywhere"
region = "fringe"
lawless = true
primary_planet = 0

[[system.planet]]
name = "Lantern's Rest"
radius = 3100000.0

[[system.station]]
name = "The Slow Lantern"
station = "sol.station_refinery"

# ---------------------------------------------------------------------------
# The Ironstar Hegemony's bloc (Phase 33 exit flight follow-up), and it exists
# because a feature turned out to be unreachable rather than because the map
# needed more places in it.
#
# ⚑⚑⚑⚑ THE HEGEMONY HELD ONE SYSTEM IN EIGHTY-FIVE, AND IT IS THE ONLY FACTION
# IN THE GAME THAT DECLARES CONTRABAND. Phase 33 stage D made legality a
# property of whoever holds a system; the flight that proved it works also
# counted the galaxy and found the whole mechanism living at a single dock:
#
#   Freight Guild 23   Solar Navy 16   Reaver Kindred 16   Corsairs 14
#   Helios Ascendancy 10   nobody 4   Frontier Compact 1   IRONSTAR HEGEMONY 1
#
# ⚑⚑⚑ AND THE CAUSE IS STRUCTURAL RATHER THAN A BAD ROLL, WHICH IS WHY THE FIX
# IS HERE AND NOT IN THE GENERATOR. `chooseCapitals` spreads capitals through
# the CORE, the core is six systems, and there are five majors - so the capitals
# are very nearly "all of the core", packed inside a 21-light-year radius. Then
# `claimTerritory` runs a multi-source Dijkstra by map distance, which hands
# every system to its nearest capital: whichever capitals happen to face
# OUTWARD sweep up the frontier and the fringe, and whichever sit INSIDE the
# cluster get their immediate neighbours and nothing else. It is not the
# Hegemony's bad luck; it is what five capitals in six core systems does, and
# some faction gets it on every seed.
#
# ⚑⚑ SO THIS IS A FOUNDING CLAIM, WHICH IS EXACTLY WHAT `faction` IS. It is not
# a thumb on the generator: `claimTerritory`'s guards 1-3 make an authored owner
# outrank the capital seed, the Dijkstra sweep AND the lawless re-roll, so these
# seven systems belong to the Hegemony from the first tick and no clan takes
# them at generation. What happens to them AFTERWARDS is still the galaxy's
# business - `FactionSim` can and does flip them, and the Trade tab's
# jurisdiction line follows the flag, which the exit flight watched happen to
# Erorea inside ten minutes.
#
# ⚑⚑ THE SECOND-ORDER COST IS REAL AND IS PAID IN `stations.toml`. A faction's
# `station_bias` applies wherever it holds territory, and the Hegemony's is the
# strongest in the game - factories x2.6, refineries x2.2, mines x1.5, farms
# x0.4 - so taking it from one system to seven RESAMPLES THE STATION MIX and
# moves every made-to-burnt ratio in the galaxy. That is the coupling
# `factions.toml`'s header warns about, and
# `shipped_content_makes_no_commodity_much_faster_than_it_is_burnt` is what
# holds it. Ratios were re-measured after this landed.
#
# ⚑ Names are authored because a bloc that reads as one place wants to sound
# like one: the Hegemony builds and breaks hulls, and its systems are named for
# the work. `region` is deliberately NOT written - the map radius decides, the
# same way it does for every other system - so the bloc sits where the geometry
# puts it rather than being declared core by fiat.
# ---------------------------------------------------------------------------

# The seat. `at_system` resolves to whichever node the generator made the
# Hegemony's capital, so this names a place the galaxy chose rather than moving
# it - and it is the anchor every row below measures its ring from.
[[system]]
id = "sol.ironhold"
name = "Ironhold"
placement = "at_system"
at_system = "sol.hegemony"
faction = "sol.hegemony"

[[system]]
id = "sol.anvil_gate"
name = "Anvil Gate"
placement = "jumps_from"
jumps_from = { system = "sol.ironhold", min = 1, max = 1 }
faction = "sol.hegemony"

[[system]]
id = "sol.forgeline"
name = "Forgeline"
placement = "jumps_from"
jumps_from = { system = "sol.ironhold", min = 1, max = 2 }
faction = "sol.hegemony"

[[system]]
id = "sol.slagfield"
name = "Slagfield"
placement = "jumps_from"
jumps_from = { system = "sol.ironhold", min = 1, max = 2 }
faction = "sol.hegemony"

[[system]]
id = "sol.rivetport"
name = "Rivetport"
placement = "jumps_from"
jumps_from = { system = "sol.ironhold", min = 2, max = 3 }
faction = "sol.hegemony"

[[system]]
id = "sol.cinder_reach"
name = "Cinder Reach"
placement = "jumps_from"
jumps_from = { system = "sol.ironhold", min = 2, max = 3 }
faction = "sol.hegemony"

[[system]]
id = "sol.hammerfall"
name = "Hammerfall"
placement = "jumps_from"
jumps_from = { system = "sol.ironhold", min = 2, max = 4 }
faction = "sol.hegemony"
